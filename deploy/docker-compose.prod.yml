version: '3.8'

services:
  cotizar-api:
    image: ${COTIZAR_IMAGE:-cotizar-api:latest}
    container_name: cotizar-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_HOST=0.0.0.0
      - BASE_PATH=/cotizar
      - DB_PATH=/app/data/cotizar.db
      - LICITOMETRO_API_URL=${LICITOMETRO_API_URL:-https://licitometro.ar/api}
      - LICITOMETRO_API_KEY=${LICITOMETRO_API_KEY:-}
    volumes:
      - cotizar-data:/app/data
      - cotizar-bids:/app/bids
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cotizar-data:
  cotizar-bids:

networks:
  default:
    name: cotizar-network
