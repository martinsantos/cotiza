# =============================================================
# SNIPPET PARA AGREGAR A NGINX DE LICITOMETRO.AR
# =============================================================
#
# Copiar este bloque dentro del server {} de www.licitometro.ar
# para que cotizAR sea accesible en /cotizar
#
# Prerequisito: cotizar-api corriendo en localhost:3000
# =============================================================

    # Rate limiting para la API de cotizAR
    # (agregar en el bloque http {}, fuera del server {})
    # limit_req_zone $binary_remote_addr zone=cotizar_api:10m rate=10r/s;

    # --- cotizAR: Armador de Cotizaciones ---

    # API de cotizAR
    location /cotizar/api/ {
        # limit_req zone=cotizar_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000/cotizar/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # UI y static files de cotizAR
    location /cotizar {
        proxy_pass http://127.0.0.1:3000/cotizar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check de cotizAR (opcional)
    location = /cotizar/health {
        proxy_pass http://127.0.0.1:3000/health;
    }
