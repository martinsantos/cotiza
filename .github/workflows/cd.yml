name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: "3001"
  IMAGE: ghcr.io/martinsantos/cotiza:latest

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Build image on GitHub runner (has npm network access)
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }} .

      # Load SSH key into agent (handles key format correctly)
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Stream image over SSH - no registry required
      - name: Ship image to VPS
        run: |
          docker save ${{ env.IMAGE }} | gzip | \
            ssh -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'docker load'

      # Git-pull scripts, start container, inject nginx
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_DIR,DEPLOY_PORT,IMAGE
          command_timeout: 10m
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            echo "========================================"
            echo "  cotizAR Deploy → $BRANCH"
            echo "========================================"

            # ── 1. GIT UPDATE (gets scripts/ dir) ─────
            echo ""
            echo "--- Git update ---"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$DEPLOY_DIR"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # ── 2. START CONTAINER ────────────────────
            # Image was already loaded via docker load — no pull needed
            echo ""
            echo "--- Docker Compose up ---"
            if docker compose version &>/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi
            $COMPOSE up -d cotizar-api
            docker image prune -f 2>/dev/null || true

            # ── 3. HEALTH CHECK ───────────────────────
            echo ""
            echo "--- Health check (port $DEPLOY_PORT) ---"
            for i in $(seq 1 24); do
              RESP=$(curl -sf "http://localhost:${DEPLOY_PORT}/cotizar/health" 2>/dev/null || echo "")
              echo "  [$i/24] → ${RESP:-EMPTY}"
              if echo "$RESP" | grep -q '"status"'; then
                echo "  HEALTHY!"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERROR: not healthy after 120s"
                docker logs cotizar-api --tail 50 2>/dev/null || true
                exit 1
              fi
              sleep 5
            done

            # ── 4. NGINX INJECTION ────────────────────
            echo ""
            echo "--- Nginx proxy injection ---"
            set +e
            PROXY_OK=false

            nginx_reload() {
              nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null
            }

            licit_http() {
              curl -so /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1/" 2>/dev/null || echo "000"
            }

            echo "Licitometro before: HTTP $(licit_http)"

            if ! command -v nginx &>/dev/null; then
              echo "nginx not in PATH — skipping injection"
            else
              echo "Stripping previous cotizAR blocks..."
              ALL_CONFS=$(nginx -T 2>/dev/null | grep "^# configuration file" | sed 's/.*file //' | sed 's/:.*//' | grep -v '^$' | sort -u)
              STRIPPED_ANY=false
              for c in $ALL_CONFS; do
                [ -f "$c" ] || continue
                if grep -q "cotizAR managed block" "$c" 2>/dev/null || grep -qE "location\s+\^\~\s+/cotizar" "$c" 2>/dev/null; then
                  cp "$c" "${c}.bak"
                  python3 "$DEPLOY_DIR/scripts/nginx_strip.py" "$c" && STRIPPED_ANY=true
                fi
              done
              if $STRIPPED_ANY && nginx -t 2>&1; then
                nginx_reload; sleep 2
                echo "After strip — licitometro: HTTP $(licit_http)"
              fi

              PROXY_CHECK=$(curl -sf --max-time 5 "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
              if echo "$PROXY_CHECK" | grep -q '"status"'; then
                echo "Proxy already working"
                PROXY_OK=true
              else
                VHOST_CONF=""
                for c in $ALL_CONFS; do
                  [ -f "$c" ] || continue
                  echo "$c" | grep -q "nginx.conf$" && continue
                  if grep -qE "listen[[:space:]]+80|server_name" "$c" 2>/dev/null; then
                    VHOST_CONF="$c"; echo "Vhost: $VHOST_CONF"; break
                  fi
                done
                if [ -z "$VHOST_CONF" ]; then
                  for c in /etc/nginx/sites-enabled/default /etc/nginx/sites-available/default \
                            /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/licitometro.conf \
                            /etc/nginx/conf.d/licitometro.ar.conf; do
                    if [ -f "$c" ] && grep -qE "server_name|listen" "$c" 2>/dev/null; then
                      VHOST_CONF="$c"; echo "Vhost (fallback): $VHOST_CONF"; break
                    fi
                  done
                fi
                echo "VHOST_CONF=${VHOST_CONF:-NONE}"

                if [ -n "$VHOST_CONF" ]; then
                  cp "$VHOST_CONF" "${VHOST_CONF}.bak"
                  if python3 "$DEPLOY_DIR/scripts/nginx_inject.py" "$VHOST_CONF" "$DEPLOY_PORT" && nginx -t 2>&1; then
                    nginx_reload && sleep 3
                    VERIFY=$(curl -sf --max-time 5 "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                    echo "cotizAR proxy: ${VERIFY:-EMPTY}"
                    LICIT_AFTER=$(licit_http)
                    echo "Licitometro after: HTTP $LICIT_AFTER"
                    if [ "$LICIT_AFTER" = "000" ]; then
                      echo "ERROR: licitometro broken — restoring"
                      cp "${VHOST_CONF}.bak" "$VHOST_CONF"; nginx_reload
                    else
                      echo "$VERIFY" | grep -q '"status"' && PROXY_OK=true || true
                    fi
                  else
                    echo "nginx config invalid — restoring"
                    cp "${VHOST_CONF}.bak" "$VHOST_CONF"; nginx_reload 2>/dev/null || true
                  fi
                else
                  echo "VHOST NOT FOUND"
                  nginx -T 2>/dev/null | grep -E "^# configuration file|server_name|listen 80" | head -20
                fi
              fi
            fi

            # ── 5. SUMMARY ────────────────────────────
            set -e
            echo ""
            echo "========================================"
            echo "  SUMMARY"
            echo "========================================"
            echo "Direct: $(curl -sf http://127.0.0.1:${DEPLOY_PORT}/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTP:   $(curl -sf http://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "Proxy OK: ${PROXY_OK:-false}"
            echo "Commit: $(git log --oneline -1)"
            echo "========================================"
