name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: main)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (safe - no downtime for licitometro)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT
          command_timeout: 10m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"
            echo "=== cotizAR CD: deploying branch $BRANCH ==="
            echo "=== SAFETY: only touching /opt/cotizar and service cotizar ==="
            echo "=== licitometro.ar services will NOT be modified ==="

            # ----------------------------------------------------------
            # STEP 0: Pre-flight - verify licitometro is alive BEFORE deploy
            # ----------------------------------------------------------
            echo ""
            echo "--- Pre-flight: checking licitometro.ar is running ---"
            LICITO_STATUS="unknown"
            if curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1:80/" 2>/dev/null | grep -qE "200|301|302"; then
              LICITO_STATUS="ok"
              echo "licitometro.ar: RUNNING (pre-deploy)"
            elif curl -sfk -o /dev/null -w "%{http_code}" "https://127.0.0.1/" 2>/dev/null | grep -qE "200|301|302"; then
              LICITO_STATUS="ok"
              echo "licitometro.ar: RUNNING via HTTPS (pre-deploy)"
            else
              echo "WARNING: Could not verify licitometro.ar (may be behind proxy)"
              LICITO_STATUS="unknown"
            fi

            # ----------------------------------------------------------
            # STEP 1: Ensure build tools for better-sqlite3
            # ----------------------------------------------------------
            echo ""
            echo "--- Step 1: Build tools ---"
            apt-get install -y python3 make g++ 2>/dev/null || true

            # ----------------------------------------------------------
            # STEP 2: Get code (only touches $DEPLOY_DIR)
            # ----------------------------------------------------------
            echo ""
            echo "--- Step 2: Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy: cloning repo..."
              mkdir -p "$DEPLOY_DIR"
              git clone -b "$BRANCH" "https://github.com/${{ github.repository }}.git" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Save current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous commit: $PREV_COMMIT"

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "New commit: $NEW_COMMIT ($(git log --oneline -1))"

            if [ "$PREV_COMMIT" = "$NEW_COMMIT" ]; then
              echo "No new commits. Re-deploying anyway..."
            fi

            # ----------------------------------------------------------
            # STEP 3: Install, build, prune
            # ----------------------------------------------------------
            echo ""
            echo "--- Step 3: Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            # Verify build output
            if [ ! -f "$DEPLOY_DIR/dist/api/server.js" ]; then
              echo "ERROR: Build failed - dist/api/server.js not found"
              exit 1
            fi
            echo "Build: OK"

            # Ensure data dirs exist
            mkdir -p data bids

            # ----------------------------------------------------------
            # STEP 4: Restart ONLY the cotizar service (NOT nginx, NOT licitometro)
            # ----------------------------------------------------------
            echo ""
            echo "--- Step 4: Restart cotizar service ---"
            systemctl restart cotizar

            # ----------------------------------------------------------
            # STEP 5: Health check with retry
            # ----------------------------------------------------------
            echo ""
            echo "--- Step 5: Health check ---"
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" > /dev/null 2>&1; then
                HEALTHY=true
                echo "=== Health check OK (attempt $i) ==="
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" | python3 -m json.tool 2>/dev/null || true
                break
              fi
              echo "Waiting... (attempt $i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo ""
              echo "!!! HEALTH CHECK FAILED - ROLLING BACK !!!"
              echo "Logs:"
              journalctl -u cotizar -n 30 --no-pager || true

              # Rollback to previous commit
              if [ "$PREV_COMMIT" != "none" ]; then
                echo ""
                echo "Rolling back to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT"
                npm ci
                npm run build
                npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" > /dev/null 2>&1; then
                  echo "ROLLBACK OK - previous version restored"
                else
                  echo "ROLLBACK FAILED - manual intervention needed"
                  systemctl stop cotizar || true
                fi
              fi
              exit 1
            fi

            # ----------------------------------------------------------
            # STEP 6: Verify licitometro is STILL alive after deploy
            # ----------------------------------------------------------
            echo ""
            echo "--- Step 6: Verify licitometro.ar still running ---"
            if [ "$LICITO_STATUS" = "ok" ]; then
              sleep 2
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "licitometro.ar: STILL RUNNING (post-deploy) - SAFE"
              else
                echo "WARNING: licitometro.ar may be affected! Check immediately!"
                echo "NOTE: cotizar only uses port $DEPLOY_PORT, should not affect licitometro"
              fi
            else
              echo "Skipped (could not verify pre-deploy)"
            fi

            echo ""
            echo "=========================================="
            echo "  DEPLOY OK - cotizAR is live"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  Health: http://127.0.0.1:$DEPLOY_PORT/health"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Post-deploy verification
        if: always()
        run: |
          echo "Deploy completed at $(date -u)"
          echo "Check: https://www.licitometro.ar/cotizar"
