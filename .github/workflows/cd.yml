name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy + proxy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 20m
          script: |
            set -euo pipefail
            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"
            echo "======================================"
            echo "  cotizAR CD → $BRANCH"
            echo "======================================"

            # ── git auth ──────────────────────────────
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ── Node.js ───────────────────────────────
            if ! command -v node &>/dev/null || [ "$(node -v | sed 's/v//' | cut -d. -f1)" -lt 18 ]; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs
            fi
            echo "Node: $(node -v)"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ── Clone / update ────────────────────────
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            PREV=$(git rev-parse HEAD 2>/dev/null || echo "none")
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # ── Build ─────────────────────────────────
            npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "Build FAILED"; exit 1; }
            mkdir -p data bids

            # ── System user ───────────────────────────
            id cotizar &>/dev/null || useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ── Stop old Docker container on port 3001 ─
            docker ps --format '{{.Names}}' 2>/dev/null | grep -qE "cotizar" && \
              docker stop $(docker ps --format '{{.Names}}' | grep cotizar) 2>/dev/null || true

            # ── Systemd service ───────────────────────
            NODE_BIN=$(command -v node)
            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR
            After=network.target
            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=0.0.0.0
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true
            [Install]
            WantedBy=multi-user.target
            SVCEOF
            sed -i 's/^            //' /etc/systemd/system/cotizar.service
            systemctl daemon-reload && systemctl enable cotizar && systemctl restart cotizar

            # ── Health check + rollback ────────────────
            HEALTHY=false
            for i in $(seq 1 18); do
              if curl -sf "http://localhost:$DEPLOY_PORT/cotizar/health" >/dev/null 2>&1; then
                HEALTHY=true; echo "Service healthy (${i})"; break
              fi
              echo "Waiting... (${i}/18)"; sleep 2
            done
            if ! $HEALTHY; then
              journalctl -u cotizar -n 30 --no-pager || true
              [ "$PREV" != "none" ] && git checkout "$PREV" && npm ci && npm run build && systemctl restart cotizar
              exit 1
            fi

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # NGINX PROXY  (non-fatal if fails)
            # Strategy 0: system nginx (most common on bare-metal VPS)
            # Strategy A: Docker nginx conf.d file
            # Strategy B: Docker nginx host bind-mount file
            # Strategy C: Docker nginx exec + base64 write
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            set +e
            echo ""
            echo "=== Nginx proxy setup ==="

            PROXY_OK=false

            # ── Check if proxy is already working ────────
            HEALTH=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q '"status"'; then
              echo "Proxy already working via port 80!"
              PROXY_OK=true
            fi

            if ! $PROXY_OK; then
              # ── STRATEGY 0: system nginx (non-Docker) ──────────────────────────────
              echo ""
              echo "--- Strategy 0: system nginx ---"
              SYS_NGINX=false
              if command -v nginx &>/dev/null; then
                if systemctl is-active --quiet nginx 2>/dev/null || \
                   service nginx status 2>/dev/null | grep -q "running\|active" || \
                   pgrep -x nginx &>/dev/null; then
                  SYS_NGINX=true
                  echo "System nginx is running"
                  echo "Nginx version: $(nginx -v 2>&1)"
                fi
              fi

              if $SYS_NGINX; then
                # Find the actual vhost config (the file with a server block on port 80)
                # Parse all config files nginx knows about via -T, find the one with listen/server_name
                VHOST_CONF=""
                ALL_CONFS=$(nginx -T 2>/dev/null \
                  | grep "^# configuration file" \
                  | sed 's/.*file //' | sed 's/:.*//' \
                  | grep -v '^$' | sort -u)
                echo "All nginx config files: $(echo $ALL_CONFS | tr '\n' ' ')"

                # Priority: files with listen 80 or server_name (skip nginx.conf itself)
                for c in $ALL_CONFS; do
                  [ -f "$c" ] || continue
                  echo "$c" | grep -q "nginx.conf$" && continue
                  if grep -qE "listen[[:space:]]+80|server_name" "$c" 2>/dev/null; then
                    VHOST_CONF="$c"
                    echo "Found vhost config: $VHOST_CONF"
                    break
                  fi
                done

                # Fallback: common paths
                if [ -z "$VHOST_CONF" ]; then
                  for c in \
                    /etc/nginx/sites-enabled/default \
                    /etc/nginx/sites-available/default \
                    /etc/nginx/conf.d/default.conf \
                    /etc/nginx/conf.d/licitometro.conf \
                    /etc/nginx/conf.d/licitometro.ar.conf; do
                    if [ -f "$c" ] && grep -qE "server_name|listen" "$c" 2>/dev/null; then
                      VHOST_CONF="$c"
                      echo "Found (fallback): $VHOST_CONF"
                      break
                    fi
                  done
                fi

                if [ -n "$VHOST_CONF" ]; then
                  echo "Patching vhost: $VHOST_CONF"
                  cp "$VHOST_CONF" "${VHOST_CONF}.bak"
                  python3 - "$VHOST_CONF" "$DEPLOY_PORT" << 'PYEOF0'
            import sys, re
            conf_file, port = sys.argv[1], sys.argv[2]
            block = """
                # cotizAR managed block - DO NOT REMOVE
                location ^~ /cotizar {
                    proxy_pass http://127.0.0.1:PORT/cotizar;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                    proxy_connect_timeout 5s;
                }""".replace("PORT", port)
            with open(conf_file, 'r') as f:
                content = f.read()
            # Remove any existing cotizAR blocks
            content = re.sub(
                r'\s*# cotizAR managed block.*?(?=\n\s*(?:location|#|server|\})|$)',
                '', content, flags=re.DOTALL)
            content = re.sub(
                r'\s*location\s+\^~\s+/cotizar\s*\{[^}]*\}',
                '', content, flags=re.DOTALL)
            # Insert before the first catch-all location, or before closing server }
            inserted = False
            for pat in [
                r'(\n[ \t]*location\s+/\s*\{)',    # location / {
                r'(\n[ \t]*location\s+~)',           # location ~ or ~*
                r'(\n[ \t]*\}\s*\n?\s*\})',          # closing }}
                r'(\n[ \t]*\})',                     # closing }
            ]:
                m = re.search(pat, content)
                if m:
                    content = content[:m.start()] + '\n' + block + content[m.start():]
                    print(f'Inserted before: {repr(m.group().strip()[:50])}')
                    inserted = True
                    break
            if not inserted:
                content += '\n' + block + '\n'
                print('Appended to end')
            with open(conf_file, 'w') as f:
                f.write(content)
            print('Done:', conf_file)
            PYEOF0
                  echo "nginx config after patch:"
                  grep -n "cotizar\|location" "$VHOST_CONF" | head -20

                  if nginx -t 2>&1; then
                    nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null
                    echo "System nginx reloaded"
                    sleep 3
                    HEALTH=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                    echo "Proxy health check: ${HEALTH:-EMPTY}"
                    if echo "$HEALTH" | grep -q '"status"'; then
                      echo "Strategy 0 SUCCESS"
                      PROXY_OK=true
                    else
                      echo "Strategy 0: reload OK but /cotizar not reachable via port 80"
                      echo "Full nginx active config:"
                      nginx -T 2>/dev/null | grep -E "server_name|listen|location|proxy_pass" | head -30
                      cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                      nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null
                      echo "Backup restored"
                    fi
                  else
                    echo "nginx -t FAILED — showing patched file:"
                    cat "$VHOST_CONF" | head -60
                    cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                    echo "Backup restored"
                  fi
                else
                  echo "No vhost config found — dumping nginx -T:"
                  nginx -T 2>/dev/null | grep -E "server_name|listen|location|root|include" | head -30
                fi
              fi
            fi

            # ── Docker nginx (if system nginx didn't solve it) ──────────────────────
            NGINX_CTR=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -iE "nginx" | head -1)
            echo ""
            echo "Nginx container: ${NGINX_CTR:-NONE}"
            if $PROXY_OK; then
              echo "Proxy already OK, skipping Docker nginx"
            elif [ -z "$NGINX_CTR" ]; then
              echo "No docker nginx container found"
            else
              # ── Find reachable host IP from container ─
              HOST_IP=""
              for TIP in \
                $(docker network inspect bridge -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null) \
                $(docker inspect "$NGINX_CTR" -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' 2>/dev/null | awk '{print $1}') \
                172.17.0.1 \
                $(hostname -I 2>/dev/null | awk '{print $1}'); do
                [ -z "$TIP" ] && continue
                RESP=$(docker exec "$NGINX_CTR" sh -c \
                  "curl -sf http://${TIP}:${DEPLOY_PORT}/cotizar/health 2>/dev/null || wget -qO- http://${TIP}:${DEPLOY_PORT}/cotizar/health 2>/dev/null" 2>/dev/null || echo "")
                if echo "$RESP" | grep -q '"status"'; then
                  HOST_IP="$TIP"
                  echo "Host reachable from nginx container at: $HOST_IP:$DEPLOY_PORT"
                  break
                fi
              done
              [ -z "$HOST_IP" ] && HOST_IP="172.17.0.1"
              echo "Using HOST_IP=$HOST_IP"

              # ── Check if already working ──────────────
              PROXY_OK=false
              HEALTH=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
              if echo "$HEALTH" | grep -q '"status"'; then
                echo "Proxy already working!"
                PROXY_OK=true
              fi

              if ! $PROXY_OK; then
                # The cotizar proxy block (using ^~ to beat SPA catch-all)
                PROXY_BLOCK="# cotizAR managed block - DO NOT REMOVE
            location ^~ /cotizar {
                proxy_pass http://${HOST_IP}:${DEPLOY_PORT}/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_read_timeout 30s;
                proxy_connect_timeout 5s;
            }"

                # ── STRATEGY A: new conf.d file ───────────
                echo ""
                echo "--- Strategy A: /etc/nginx/conf.d/cotizar.conf ---"
                # Check nginx.conf includes conf.d
                INCLUDES_CONFD=$(docker exec "$NGINX_CTR" nginx -T 2>&1 | grep "conf\.d" | grep -c "include" || echo "0")
                echo "nginx.conf includes conf.d: $INCLUDES_CONFD"

                if [ "$INCLUDES_CONFD" -gt 0 ]; then
                  # Remove old cotizar.conf if exists
                  docker exec "$NGINX_CTR" rm -f /etc/nginx/conf.d/cotizar.conf 2>/dev/null || true

                  # Write a standalone server-aware config snippet
                  # We need to find if nginx has a server block in a conf.d file
                  HAS_SERVER_IN_CONFD=$(docker exec "$NGINX_CTR" sh -c \
                    "grep -rl 'server_name\|listen' /etc/nginx/conf.d/ 2>/dev/null | head -1")
                  echo "Server in conf.d: ${HAS_SERVER_IN_CONFD:-none}"

                  if [ -n "$HAS_SERVER_IN_CONFD" ]; then
                    # conf.d has full server blocks → inject into the right one
                    # Use Python inside the container to modify the file in place
                    docker exec "$NGINX_CTR" sh -c "python3 - '$HAS_SERVER_IN_CONFD' '$HOST_IP' '$DEPLOY_PORT'" << 'PYEOF'
            import sys, re
            conf_file, host_ip, port = sys.argv[1], sys.argv[2], sys.argv[3]

            block = f"""
                # cotizAR managed block - DO NOT REMOVE
                location ^~ /cotizar {{
                    proxy_pass http://{host_ip}:{port}/cotizar;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                    proxy_connect_timeout 5s;
                }}"""

            with open(conf_file, 'r') as f:
                content = f.read()

            # Remove existing cotizar blocks
            content = re.sub(r'\s*# cotizAR managed block.*?(?=\n\s*location|\n\s*\}|\Z)',
                             '', content, flags=re.DOTALL)
            content = re.sub(r'\s*location\s+\^~\s+/cotizar\s*\{[^}]*\}', '', content, flags=re.DOTALL)

            # Insert before first location / or location ~* or before closing server }
            inserted = False
            for pat in [r'(\n[ \t]*location\s+/\s*\{)', r'(\n[ \t]*location\s+~)', r'(\n\})']:
                m = re.search(pat, content)
                if m:
                    content = content[:m.start()] + '\n' + block + content[m.start():]
                    print(f'Inserted before: {m.group().strip()[:40]}')
                    inserted = True
                    break

            if not inserted:
                content += '\n' + block + '\n'
                print('Appended to end')

            with open(conf_file, 'w') as f:
                f.write(content)
            print('Done')
            PYEOF
                    echo "Modified $HAS_SERVER_IN_CONFD inside container"
                  else
                    # conf.d only has location/map blocks → add a plain location snippet
                    # But this won't work without an enclosing server block
                    # Fall through to Strategy B/C
                    echo "conf.d has no server blocks → using Strategy B/C"
                    INCLUDES_CONFD=0
                  fi
                fi

                # ── STRATEGY B: modify HOST bind-mount file ─
                if [ "$INCLUDES_CONFD" -eq 0 ] || ! docker exec "$NGINX_CTR" nginx -t 2>/dev/null; then
                  echo ""
                  echo "--- Strategy B: host bind-mount ---"
                  # Get all bind mounts of nginx container
                  MOUNTS=$(docker inspect "$NGINX_CTR" --format \
                    '{{range .Mounts}}{{.Type}}|{{.Source}}|{{.Destination}}{{"\n"}}{{end}}' 2>/dev/null)
                  echo "Mounts: $MOUNTS"

                  HOST_CONF=""
                  while IFS='|' read -r mtype msrc mdst; do
                    [ "$mtype" != "bind" ] && continue
                    case "$mdst" in
                      *.conf|*/conf.d/*)
                        if [ -f "$msrc" ] && grep -qE "server|location" "$msrc" 2>/dev/null; then
                          HOST_CONF="$msrc"
                          echo "Bind-mounted config: $msrc → $mdst"
                          break
                        fi
                        ;;
                    esac
                  done <<< "$MOUNTS"

                  # Also check compose labels for project dir
                  if [ -z "$HOST_CONF" ]; then
                    COMPOSE_DIR=$(docker inspect "$NGINX_CTR" \
                      --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null || true)
                    for cand in \
                      "${COMPOSE_DIR}/nginx/conf.d/default.conf" \
                      "${COMPOSE_DIR}/nginx.conf" \
                      "${COMPOSE_DIR}/nginx/nginx.conf" \
                      /opt/licitometro/nginx/conf.d/default.conf \
                      /opt/licitometro/nginx.conf \
                      /root/licitometro/nginx.conf; do
                      [ -z "$cand" ] && continue
                      if [ -f "$cand" ] && grep -qE "server|location" "$cand" 2>/dev/null; then
                        HOST_CONF="$cand"
                        echo "Found via search: $HOST_CONF"
                        break
                      fi
                    done
                  fi

                  if [ -n "$HOST_CONF" ]; then
                    cp "$HOST_CONF" "${HOST_CONF}.bak"
                    python3 - "$HOST_CONF" "$HOST_IP" "$DEPLOY_PORT" << 'PYEOF2'
            import sys, re
            conf_file, host_ip, port = sys.argv[1], sys.argv[2], sys.argv[3]

            block = f"""
                # cotizAR managed block - DO NOT REMOVE
                location ^~ /cotizar {{
                    proxy_pass http://{host_ip}:{port}/cotizar;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                    proxy_connect_timeout 5s;
                }}"""

            with open(conf_file, 'r') as f:
                content = f.read()

            content = re.sub(r'\s*# cotizAR managed block.*?(?=\n\s*location|\n\s*\}|\Z)',
                             '', content, flags=re.DOTALL)
            content = re.sub(r'\s*location\s+\^~\s+/cotizar\s*\{[^}]*\}', '', content, flags=re.DOTALL)

            inserted = False
            for pat in [r'(\n[ \t]*location\s+/\s*\{)', r'(\n[ \t]*location\s+~)', r'(\n\s*\})']:
                m = re.search(pat, content)
                if m:
                    content = content[:m.start()] + '\n' + block + content[m.start():]
                    print(f'Inserted before: {m.group().strip()[:40]}')
                    inserted = True
                    break

            if not inserted:
                content += '\n' + block + '\n'

            with open(conf_file, 'w') as f:
                f.write(content)
            print('Done - modified', conf_file)
            PYEOF2
                    echo "Modified host file: $HOST_CONF"
                  else
                    # ── STRATEGY C: docker exec base64 write ─────────
                    echo ""
                    echo "--- Strategy C: docker exec write ---"
                    CONT_CONF=$(docker exec "$NGINX_CTR" \
                      sh -c "nginx -T 2>&1 | grep '# configuration file' | grep -v 'nginx.conf:' | head -1 | sed 's/.*file //' | sed 's/:.*//' " 2>/dev/null || echo "")
                    [ -z "$CONT_CONF" ] && CONT_CONF="/etc/nginx/conf.d/default.conf"
                    echo "Container config: $CONT_CONF"
                    docker exec "$NGINX_CTR" cat "$CONT_CONF" > /tmp/ng.conf 2>/dev/null

                    python3 - /tmp/ng.conf "$HOST_IP" "$DEPLOY_PORT" << 'PYEOF3'
            import sys, re
            conf_file, host_ip, port = sys.argv[1], sys.argv[2], sys.argv[3]

            block = f"""
                # cotizAR managed block - DO NOT REMOVE
                location ^~ /cotizar {{
                    proxy_pass http://{host_ip}:{port}/cotizar;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                }}"""

            with open(conf_file, 'r') as f:
                content = f.read()

            content = re.sub(r'\s*# cotizAR managed block.*?(?=\n\s*location|\n\s*\}|\Z)',
                             '', content, flags=re.DOTALL)
            content = re.sub(r'\s*location\s+\^~\s+/cotizar\s*\{[^}]*\}', '', content, flags=re.DOTALL)

            inserted = False
            for pat in [r'(\n[ \t]*location\s+/\s*\{)', r'(\n[ \t]*location\s+~)', r'(\n\s*\})']:
                m = re.search(pat, content)
                if m:
                    content = content[:m.start()] + '\n' + block + content[m.start():]
                    inserted = True
                    break

            if not inserted:
                content += '\n' + block + '\n'

            with open(conf_file, 'w') as f:
                f.write(content)
            print('Done')
            PYEOF3
                    B64=$(base64 -w0 /tmp/ng.conf)
                    docker exec "$NGINX_CTR" sh -c "echo '$B64' | base64 -d > $CONT_CONF"
                    echo "Wrote config via base64 to container"
                  fi
                fi

                # ── Test & reload ──────────────────────────
                echo ""
                echo "--- nginx -t and reload ---"
                if docker exec "$NGINX_CTR" nginx -t 2>&1; then
                  docker exec "$NGINX_CTR" nginx -s reload
                  echo "Reloaded"
                  sleep 3
                else
                  echo "nginx -t FAILED — showing config:"
                  docker exec "$NGINX_CTR" nginx -T 2>&1 | grep -A5 "cotizar" | head -30
                  # Restore backup if available
                  [ -n "${HOST_CONF:-}" ] && [ -f "${HOST_CONF}.bak" ] && \
                    cp "${HOST_CONF}.bak" "$HOST_CONF" && \
                    docker exec "$NGINX_CTR" nginx -s reload 2>/dev/null && \
                    echo "Backup restored"
                fi

                # ── Verify from host ───────────────────────
                echo ""
                echo "--- Verification from host ---"
                for i in 1 2 3; do
                  RESULT=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                  if echo "$RESULT" | grep -q '"status"'; then
                    PROXY_OK=true
                    echo "PROXY OK: $RESULT"
                    break
                  fi
                  sleep 2
                done

                if ! $PROXY_OK; then
                  echo "=== PROXY NOT WORKING - diagnostics ==="
                  echo "Port listeners:"
                  ss -tlnp 2>/dev/null | grep -E ':80|:443|:3001' || true
                  echo "Nginx active config (location blocks):"
                  docker exec "$NGINX_CTR" nginx -T 2>&1 | grep -E "location|proxy_pass|server_name|listen|try_files" | head -30
                  echo "Direct cotizar test: $(curl -sf http://127.0.0.1:$DEPLOY_PORT/cotizar/health 2>/dev/null || echo FAIL)"
                  echo "Docker network:"
                  docker exec "$NGINX_CTR" sh -c "curl -sf http://${HOST_IP}:${DEPLOY_PORT}/cotizar/health 2>/dev/null || wget -qO- http://${HOST_IP}:${DEPLOY_PORT}/cotizar/health 2>/dev/null || echo UNREACHABLE"
                fi
              fi

              # ── Full infra dump (for debugging) ───────
              echo ""
              echo "=== Infrastructure ==="
              echo "Port 80/443/3001 listeners:"
              ss -tlnp 2>/dev/null | grep -E ':80 |:443 |:3001 ' || true
              echo "Cloudflared: $(pgrep cloudflared 2>/dev/null && echo RUNNING || echo not running)"
              echo "Caddy: $(pgrep caddy 2>/dev/null && echo RUNNING || echo not running)"
              echo "Docker containers:"
              docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Image}}' 2>/dev/null
              echo "Nginx full config (locations):"
              docker exec "$NGINX_CTR" nginx -T 2>&1 | grep -E "server_name|listen|location|proxy_pass|try_files|root" | head -40
            fi

            # ── Final diagnostics (always) ─────────────
            echo ""
            echo "=== Infrastructure summary ==="
            echo "Port 80/443/3001 listeners:"
            ss -tlnp 2>/dev/null | grep -E ':80 |:443 |:3001 ' || true
            echo "System nginx: $(systemctl is-active nginx 2>/dev/null || echo not-systemd)"
            echo "Cloudflared: $(pgrep cloudflared 2>/dev/null && echo RUNNING || echo not running)"
            echo "Caddy: $(pgrep caddy 2>/dev/null && echo RUNNING || echo not running)"
            echo "Docker containers: $(docker ps --format '{{.Names}}' 2>/dev/null | tr '\n' ' ' || echo none)"
            echo "Direct health: $(curl -sf http://127.0.0.1:$DEPLOY_PORT/cotizar/health 2>/dev/null || echo FAIL)"
            echo "Proxy health:  $(curl -sf http://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"

            set -euo pipefail

            # ── Cleanup git credentials ────────────────
            git config --global --unset-all "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof" 2>/dev/null || true

            echo ""
            echo "======================================"
            echo "  DEPLOY DONE: $(git log --oneline -1)"
            echo "  Service:  http://localhost:$DEPLOY_PORT/cotizar/"
            echo "  Proxy OK: $PROXY_OK"
            echo "======================================"
            # If proxy didn't work, exit 1 so the step is red
            $PROXY_OK || { echo "WARNING: proxy not configured - site may not be visible at licitometro.ar/cotizar"; exit 1; }

      - name: Smoke test (fails if proxy not working)
        if: always()
        run: |
          echo "Waiting 10s for nginx to stabilize..."
          sleep 10
          echo "Testing https://www.licitometro.ar/cotizar/health ..."
          BODY=$(curl -sf --max-time 10 "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "CURL_FAIL")
          echo "Response: ${BODY:0:200}"

          if echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok'" 2>/dev/null; then
            echo "✅ PUBLIC HEALTH CHECK OK"
          elif echo "$BODY" | grep -qi "licitometro\|<!DOCTYPE\|<html"; then
            echo "❌ Getting licitometro HTML instead of cotizAR JSON"
            echo "   The nginx proxy is NOT routing /cotizar → cotizar service"
            echo "   Check the 'Deploy + proxy via SSH' step logs for nginx diagnostics"
            exit 1
          else
            echo "⚠️  VPS not reachable from GitHub runners (firewall)"
            echo "   Check direct access: http://76.13.234.213:3001/cotizar/health"
            echo "   NOTE: this does NOT mean the deploy failed"
          fi
