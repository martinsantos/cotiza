name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_DIR,DEPLOY_PORT
          command_timeout: 20m
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            echo "=== cotizAR deploy → $BRANCH ==="

            # ── git auth ──────────────────────────────
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ── Clone / update ────────────────────────
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$DEPLOY_DIR"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # ── Docker Compose up ─────────────────────
            docker compose up -d --build cotizar-api
            docker image prune -f 2>/dev/null || true

            # ── Wait for health ───────────────────────
            echo "Waiting for cotizar-api..."
            HEALTHY=false
            for i in $(seq 1 24); do
              if curl -sf "http://localhost:${DEPLOY_PORT}/cotizar/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Healthy after ${i}x5s"
                break
              fi
              echo "  attempt $i/24..."
              sleep 5
            done

            if ! $HEALTHY; then
              echo "=== NOT healthy — docker logs ==="
              docker logs cotizar-api --tail 50 2>/dev/null || true
              echo "=== Ports ==="
              ss -tlnp 2>/dev/null | grep -E ":${DEPLOY_PORT}|:80|:443" || true
              exit 1
            fi

            # ── Inject /cotizar proxy into system nginx ──
            set +e
            echo ""
            echo "=== Nginx proxy injection ==="
            PROXY_OK=false

            if curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null | grep -q '"status"'; then
              echo "Proxy already working"
              PROXY_OK=true
            fi

            if ! $PROXY_OK && command -v nginx &>/dev/null; then
              VHOST_CONF=""
              ALL_CONFS=$(nginx -T 2>/dev/null | grep "^# configuration file" | sed 's/.*file //' | sed 's/:.*//' | grep -v '^$' | sort -u)

              for c in $ALL_CONFS; do
                [ -f "$c" ] || continue
                echo "$c" | grep -q "nginx.conf$" && continue
                if grep -qE "listen[[:space:]]+80|server_name" "$c" 2>/dev/null; then
                  VHOST_CONF="$c"; echo "Found vhost: $VHOST_CONF"; break
                fi
              done

              if [ -z "$VHOST_CONF" ]; then
                for c in \
                  /etc/nginx/sites-enabled/default \
                  /etc/nginx/sites-available/default \
                  /etc/nginx/conf.d/default.conf \
                  /etc/nginx/conf.d/licitometro.conf \
                  /etc/nginx/conf.d/licitometro.ar.conf; do
                  if [ -f "$c" ] && grep -qE "server_name|listen" "$c" 2>/dev/null; then
                    VHOST_CONF="$c"; echo "Found (fallback): $VHOST_CONF"; break
                  fi
                done
              fi

              if [ -n "$VHOST_CONF" ]; then
                cp "$VHOST_CONF" "${VHOST_CONF}.bak"
                python3 - "$VHOST_CONF" "$DEPLOY_PORT" << 'PYEOF'
            import sys, re
            conf_file, port = sys.argv[1], sys.argv[2]
            proxy_block = """
                # cotizAR managed block - DO NOT REMOVE
                location ^~ /cotizar {
                    proxy_pass http://127.0.0.1:PORT/cotizar;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                    proxy_connect_timeout 5s;
                }""".replace("PORT", port)
            with open(conf_file, 'r') as f:
                content = f.read()
            content = re.sub(r'\s*# cotizAR managed block.*?(?=\n\s*(?:location|#|server|\})|$)', '', content, flags=re.DOTALL)
            content = re.sub(r'\s*location\s+\^~\s+/cotizar\s*\{[^}]*\}', '', content, flags=re.DOTALL)
            def find_server_blocks(text):
                blocks = []
                for m in re.finditer(r'\bserver\s*\{', text):
                    start = m.start()
                    depth, pos = 0, m.end() - 1
                    while pos < len(text):
                        if text[pos] == '{': depth += 1
                        elif text[pos] == '}':
                            depth -= 1
                            if depth == 0: blocks.append((start, pos + 1)); break
                        pos += 1
                return blocks
            def score(bt):
                s = 0
                if re.search(r'\broot\b', bt): s += 20
                if re.search(r'\btry_files\b', bt): s += 15
                if re.search(r'location\s+/', bt): s += 10
                if re.search(r'listen\s+443', bt): s += 5
                if re.search(r'return\s+30\d', bt): s -= 30
                return s
            server_blocks = find_server_blocks(content)
            print(f'Found {len(server_blocks)} server block(s)')
            if not server_blocks:
                content += '\n' + proxy_block + '\n'
            else:
                scored = sorted([(score(content[s:e]), s, e) for s, e in server_blocks], reverse=True)
                _, best_start, best_end = scored[0]
                block_text = content[best_start:best_end]
                insert_pos = None
                for pat in [r'\n[ \t]*location\s+/\s*\{', r'\n[ \t]*location\s+~', r'\n[ \t]*error_page\b']:
                    m = re.search(pat, block_text)
                    if m: insert_pos = best_start + m.start(); break
                if insert_pos is None: insert_pos = best_end - 1
                content = content[:insert_pos] + '\n' + proxy_block + content[insert_pos:]
            with open(conf_file, 'w') as f:
                f.write(content)
            print('Patched:', conf_file)
            PYEOF
                if nginx -t 2>&1; then
                  nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null
                  echo "nginx reloaded OK"
                  sleep 3
                  PROXY_OK=true
                else
                  echo "nginx -t FAILED — restoring"
                  cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                  nginx -s reload 2>/dev/null || true
                fi
              else
                echo "No vhost config found — nginx -T output:"
                nginx -T 2>/dev/null | grep -E "server_name|listen|location|root|include" | head -30
              fi
            fi

            # ── Cleanup & summary ─────────────────────
            git config --global --unset-all "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof" 2>/dev/null || true
            echo ""
            echo "=== Summary ==="
            echo "Direct: $(curl -sf http://127.0.0.1:${DEPLOY_PORT}/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTP:   $(curl -sf http://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTPS:  $(curl -sfk https://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "Proxy OK: $PROXY_OK"
            echo "Commit: $(git log --oneline -1)"
