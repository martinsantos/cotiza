name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"

            echo "=========================================="
            echo "  cotizAR CD - branch: $BRANCH"
            echo "  GH_TOKEN length: ${#GH_TOKEN}"
            echo "=========================================="

            # Validate token
            if [ -z "$GH_TOKEN" ] || [ "${#GH_TOKEN}" -lt 10 ]; then
              echo "ERROR: GH_TOKEN is empty or too short!"
              echo "Check that github.token is properly passed via envs parameter"
              exit 1
            fi

            # Configure git auth - clear any stale credentials
            git config --global --unset-all credential.helper 2>/dev/null || true
            git config --global --unset-all "url.https://x-access-token" 2>/dev/null || true
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

            # Build authenticated URL for direct use
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ==========================================================
            # STEP 0: Pre-flight - licitometro alive?
            # ==========================================================
            echo ""
            echo "--- [0/8] Pre-flight ---"
            LICITO_OK=false
            if curl -sf -o /dev/null -w "" "http://127.0.0.1:80/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP (pre-deploy)"
            elif curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP via HTTPS"
            else
              echo "WARN: cannot reach licitometro (may be normal)"
            fi

            # ==========================================================
            # STEP 1: Ensure Node.js >= 18
            # ==========================================================
            echo ""
            echo "--- [1/8] Node.js ---"
            if command -v node &>/dev/null; then
              NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
              if [ "$NODE_MAJOR" -ge 18 ]; then
                echo "Node $(node -v) OK"
              else
                echo "Node $(node -v) too old, installing 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
              fi
            else
              echo "Node not found, installing 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # ==========================================================
            # STEP 2: Build tools (for better-sqlite3 native addon)
            # ==========================================================
            echo ""
            echo "--- [2/8] Build tools ---"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ==========================================================
            # STEP 3: Clone or update code
            # ==========================================================
            echo ""
            echo "--- [3/8] Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy - cloning..."
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Ensure remote uses authenticated URL
            git remote set-url origin "$REPO_URL" 2>/dev/null || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous: $PREV_COMMIT"

            git fetch origin "$BRANCH" || git fetch origin
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            echo "Now: $(git log --oneline -1)"

            # ==========================================================
            # STEP 4: Build
            # ==========================================================
            echo ""
            echo "--- [4/8] Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "ERROR: build failed"; exit 1; }
            echo "Build OK"

            mkdir -p data bids

            # ==========================================================
            # STEP 5: System user + permissions
            # ==========================================================
            echo ""
            echo "--- [5/8] System user ---"
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
              echo "User 'cotizar' created"
            else
              echo "User 'cotizar' exists"
            fi
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ==========================================================
            # STEP 6: Systemd service
            # ==========================================================
            echo ""
            echo "--- [6/8] Systemd service ---"
            NODE_BIN=$(command -v node)

            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # fix heredoc indentation
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar
            echo "Service restarted"

            # Health check
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Health OK (attempt $i)"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || true
                break
              fi
              echo "Waiting... ($i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo "!!! SERVICE FAILED TO START !!!"
              journalctl -u cotizar -n 40 --no-pager 2>/dev/null || true

              if [ "$PREV_COMMIT" != "none" ]; then
                echo "ROLLBACK to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT" 2>/dev/null || true
                npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1 && echo "ROLLBACK OK" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            # ==========================================================
            # STEP 7: Nginx reverse proxy (DIRECT inline, self-contained)
            # ==========================================================
            echo ""
            echo "--- [7/8] Nginx ---"

            if ! command -v nginx &>/dev/null; then
              echo "nginx not installed, skipping proxy config"
            else
              # DIAGNOSTIC: full nginx state
              echo "=== NGINX STATE ==="
              nginx -v 2>&1 || true
              echo "Config files:"
              find /etc/nginx -type f \( -name '*.conf' -o -name 'default' \) 2>/dev/null | grep -v '\.bak' | sort
              echo "Sites enabled:"
              ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo "(none)"
              echo "Sites available:"
              ls -la /etc/nginx/sites-available/ 2>/dev/null || echo "(none)"
              echo ""
              echo "Full config (nginx -T):"
              nginx -T 2>&1 || echo "nginx -T failed"
              echo "=== END STATE ==="

              # All-in-one Python script - no shell variables needed
              python3 << 'PYEOF'
            import subprocess, re, os, sys, shutil
            from datetime import datetime

            COTIZAR_BLOCK = """
            # BEGIN COTIZAR PROXY (auto-managed by CD - do not edit)
            location ^~ /cotizar/api/ {
                proxy_pass http://127.0.0.1:3001/cotizar/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 30s;
            }
            location ^~ /cotizar/config/ {
                proxy_pass http://127.0.0.1:3001/cotizar/config/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            location ^~ /cotizar/health {
                proxy_pass http://127.0.0.1:3001/health;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }
            location ^~ /cotizar {
                proxy_pass http://127.0.0.1:3001/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            # END COTIZAR PROXY
            """

            # Clean up indentation from YAML/heredoc
            lines_raw = COTIZAR_BLOCK.split('\n')
            # Find minimum indentation (ignoring empty lines)
            min_indent = 999
            for l in lines_raw:
                if l.strip():
                    min_indent = min(min_indent, len(l) - len(l.lstrip()))
            if min_indent == 999:
                min_indent = 0
            COTIZAR_BLOCK = '\n'.join(l[min_indent:] for l in lines_raw).strip()

            print(f"Cotizar block ({len(COTIZAR_BLOCK)} chars):")
            print(COTIZAR_BLOCK[:200])
            print("...")

            def run(cmd):
                r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                return r.stdout + r.stderr

            # Get full merged nginx config
            full = run("nginx -T 2>&1")

            # Parse nginx -T to map server blocks to their source files
            # nginx -T outputs: # configuration file /path/to/file:
            current_file = None
            server_blocks = []  # list of (file, has_ssl, has_location, has_content_root)
            in_server = False
            has_ssl = False
            has_location = False
            has_root = False
            brace_depth = 0

            for line in full.splitlines():
                m = re.match(r'# configuration file (.+):$', line)
                if m:
                    current_file = m.group(1)
                    continue

                stripped = line.strip()

                if re.match(r'server\s*\{', stripped):
                    in_server = True
                    has_ssl = False
                    has_location = False
                    has_root = False
                    brace_depth = 0

                if in_server:
                    brace_depth += line.count('{') - line.count('}')
                    if 'ssl' in stripped:
                        has_ssl = True
                    if re.match(r'location\s+', stripped):
                        has_location = True
                    if re.match(r'root\s+', stripped) or 'try_files' in stripped:
                        has_root = True
                    if brace_depth <= 0 and '}' in line:
                        server_blocks.append({
                            'file': current_file,
                            'ssl': has_ssl,
                            'location': has_location,
                            'root': has_root,
                        })
                        in_server = False

            print(f"\nFound {len(server_blocks)} server blocks:")
            for sb in server_blocks:
                print(f"  {sb['file']} - ssl={sb['ssl']} loc={sb['location']} root={sb['root']}")

            # Choose target files: prefer SSL blocks with locations/root
            target_files = set()

            # Priority 1: SSL server blocks with locations
            for sb in server_blocks:
                if sb['ssl'] and (sb['location'] or sb['root']) and sb['file']:
                    target_files.add(sb['file'])

            # Priority 2: any server block with locations
            if not target_files:
                for sb in server_blocks:
                    if sb['location'] and sb['file']:
                        target_files.add(sb['file'])

            # Priority 3: any server block at all
            if not target_files:
                for sb in server_blocks:
                    if sb['file']:
                        target_files.add(sb['file'])

            # Priority 4: raw file search
            if not target_files:
                print("No server blocks found in nginx -T, searching files...")
                for d in ['/etc/nginx/sites-enabled', '/etc/nginx/sites-available', '/etc/nginx/conf.d']:
                    if os.path.isdir(d):
                        for f in sorted(os.listdir(d)):
                            fp = os.path.join(d, f)
                            if not f.endswith('.bak') and (os.path.isfile(fp) or os.path.islink(fp)):
                                real = os.path.realpath(fp)
                                target_files.add(real)
                                print(f"  Found: {fp} -> {real}")

            print(f"\nTarget files: {target_files}")

            if not target_files:
                print("ERROR: no nginx config files found!")
                sys.exit(1)

            modified = 0
            for conf_path in sorted(target_files):
                print(f"\n{'='*60}")
                print(f"Processing: {conf_path}")
                print(f"{'='*60}")

                if '.bak' in conf_path:
                    print("Skipping backup file")
                    continue

                try:
                    with open(conf_path, 'r') as f:
                        original = f.read()
                except Exception as e:
                    # If it's a symlink, resolve it
                    real = os.path.realpath(conf_path)
                    print(f"Could not read {conf_path}, trying {real}")
                    with open(real, 'r') as f:
                        original = f.read()
                    conf_path = real

                print(f"Size: {len(original)} bytes")
                print(f"Content:\n{original}\n")

                # Remove any old cotizar entries (includes or inline blocks)
                cleaned = original
                cleaned = re.sub(r'\n?\s*include\s+/etc/nginx/snippets/cotizar\.conf;\s*\n?', '\n', cleaned)
                cleaned = re.sub(r'\s*# BEGIN COTIZAR PROXY.*?# END COTIZAR PROXY\s*', '', cleaned, flags=re.DOTALL)

                if cleaned != original:
                    print("Cleaned old cotizar entries")

                # Parse and inject into server blocks that have locations
                lines = cleaned.splitlines(True)
                new_lines = []
                i = 0
                inserted_here = False

                while i < len(lines):
                    stripped = lines[i].strip()

                    if re.match(r'server\s*\{', stripped):
                        # Collect entire server block
                        depth = 0
                        block = []
                        j = i
                        first_loc = -1
                        while j < len(lines):
                            block.append(lines[j])
                            depth += lines[j].count('{') - lines[j].count('}')
                            s = lines[j].strip()
                            if re.match(r'location\s+', s) and first_loc < 0:
                                first_loc = len(block) - 1
                            if depth <= 0 and j > i:
                                break
                            j += 1

                        if first_loc >= 0:
                            # Insert before first location
                            for k, bl in enumerate(block):
                                if k == first_loc:
                                    new_lines.append('\n')
                                    for cl in COTIZAR_BLOCK.splitlines():
                                        new_lines.append('    ' + cl + '\n')
                                    new_lines.append('\n')
                                    inserted_here = True
                                    print(f"INSERTED before location at line {i + first_loc + 1}")
                                new_lines.append(bl)
                        else:
                            # No locations - insert before closing brace
                            for k, bl in enumerate(block):
                                if k == len(block) - 1:  # last line = closing }
                                    new_lines.append('\n')
                                    for cl in COTIZAR_BLOCK.splitlines():
                                        new_lines.append('    ' + cl + '\n')
                                    new_lines.append('\n')
                                    inserted_here = True
                                    print(f"INSERTED before closing brace at line {i + k + 1}")
                                new_lines.append(bl)

                        i = j + 1
                        continue

                    new_lines.append(lines[i])
                    i += 1

                if inserted_here:
                    ts = datetime.now().strftime('%Y%m%d%H%M%S')
                    backup = f"{conf_path}.bak.{ts}"
                    shutil.copy2(conf_path, backup)
                    print(f"Backup: {backup}")

                    with open(conf_path, 'w') as f:
                        f.writelines(new_lines)
                    modified += 1

                    print(f"Written: {len(new_lines)} lines")
                    # Show cotizar-related lines
                    for idx, l in enumerate(new_lines):
                        if 'cotizar' in l.lower():
                            print(f"  L{idx+1}: {l.rstrip()}")
                else:
                    print("WARNING: could not find insertion point in this file")

            print(f"\n{'='*60}")
            print(f"TOTAL CONFIGS MODIFIED: {modified}")
            print(f"{'='*60}")

            if modified == 0:
                print("\nFAILED: Could not modify any config!")
                print("Manual fix: add these lines inside the HTTPS server block:")
                print(COTIZAR_BLOCK)
                sys.exit(1)
            PYEOF

              PYEXIT=$?
              echo ""
              echo "Python script exit code: $PYEXIT"

              if [ "$PYEXIT" -eq 0 ]; then
                echo "Validating nginx..."
                if nginx -t 2>&1; then
                  nginx -s reload
                  echo "nginx reloaded"
                  sleep 2

                  # Verify proxy works
                  echo ""
                  echo "--- Proxy verification ---"
                  echo -n "/cotizar/health via nginx: "
                  HBODY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "FAIL")
                  echo "$HBODY"

                  if echo "$HBODY" | grep -q "status"; then
                    echo "PROXY IS WORKING"
                  else
                    echo "PROXY NOT WORKING - dumping debug info:"
                    echo -n "  Direct health check: "
                    curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || echo "FAIL"
                    echo ""
                    echo "  Current nginx config:"
                    nginx -T 2>&1 | grep -A2 "cotizar" || echo "  (no cotizar in config!)"
                  fi
                else
                  echo "nginx -t FAILED! Restoring backups..."
                  echo "nginx -t output:"
                  nginx -t 2>&1 || true
                  # Restore most recent backups
                  find /etc/nginx -name '*.bak.*' -mmin -5 2>/dev/null | while read bak; do
                    orig=$(echo "$bak" | sed 's/\.bak\.[0-9]*//')
                    cp "$bak" "$orig" && echo "Restored: $orig"
                  done
                  nginx -t 2>/dev/null && nginx -s reload 2>/dev/null || true
                fi
              else
                echo "Config injection failed. Check logs above."
              fi
            fi

            # ==========================================================
            # STEP 8: Final verification
            # ==========================================================
            echo ""
            echo "--- [8/8] Verify ---"

            # Direct
            echo -n "Direct health: "
            curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null && echo "" || echo "FAIL"

            echo -n "Direct API: "
            curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1:$DEPLOY_PORT/cotizar/api/tenders" 2>/dev/null || echo "FAIL"
            echo ""

            # Via nginx - verify proxy is actually reaching cotizar (not licitometro SPA)
            echo -n "Nginx /cotizar/health: "
            HEALTH_BODY=$(curl -sf "http://localhost/cotizar/health" 2>/dev/null || echo "FAIL")
            echo "$HEALTH_BODY"
            if echo "$HEALTH_BODY" | grep -q '"status"'; then
              echo "PROXY OK - cotizar is responding through nginx"
            else
              echo "WARN: /cotizar/health did not return JSON - nginx may not be proxying correctly"
              echo "DIAG: checking nginx config for cotizar includes..."
              grep -rn "cotizar" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || true
              echo "DIAG: response body preview:"
              curl -sf "http://localhost/cotizar/health" 2>/dev/null | head -c 200 || true
              echo ""
            fi

            echo -n "Nginx /cotizar: "
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost/cotizar/" 2>/dev/null || echo "000")
            echo "HTTP $STATUS"

            # Licitometro still alive
            if $LICITO_OK; then
              echo -n "licitometro.ar post-deploy: "
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "STILL ALIVE"
              else
                echo "WARNING - CHECK NOW"
              fi
            fi

            # Cleanup: remove git token from global config
            git config --global --unset-all url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "  DEPLOY COMPLETE"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Smoke test from outside
        if: always()
        run: |
          echo "Checking public URL..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "000")
          echo "https://www.licitometro.ar/cotizar/health -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "PUBLIC HEALTH CHECK: OK"
          else
            echo "Public health check failed (HTTP $STATUS) - may need manual nginx config"
          fi
