name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"
            echo "=== cotizAR CD: deploying branch $BRANCH ==="

            # Ensure build tools for better-sqlite3
            apt-get install -y python3 make g++ 2>/dev/null || true

            cd $DEPLOY_DIR

            # Fetch and checkout
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # Install, build, prune
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            # Ensure data dirs exist
            mkdir -p data bids

            # Restart service
            systemctl restart cotizar

            # Health check with retry
            echo "Waiting for health check..."
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" > /dev/null 2>&1; then
                echo "=== Deploy OK! cotizAR is live ==="
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" | python3 -m json.tool
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed. Logs:"
            journalctl -u cotizar -n 30 --no-pager
            exit 1

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf "http://${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PORT }}/health" || echo "Direct check skipped (firewall)"
