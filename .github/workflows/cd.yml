name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"
            echo "=== cotizAR CD → branch: $BRANCH ==="

            # Git auth
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # Node.js ≥ 18
            if ! command -v node &>/dev/null || [ "$(node -v | sed 's/v//' | cut -d. -f1)" -lt 18 ]; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v)"

            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # Clone or update
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            PREV=$(git rev-parse HEAD 2>/dev/null || echo "none")
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # Build
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true
            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "Build failed"; exit 1; }
            mkdir -p data bids

            # System user
            id cotizar &>/dev/null || useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # Stop old Docker container if running on port 3001
            docker ps --format '{{.Names}}' 2>/dev/null | grep -qx "cotizar-api" && \
              docker stop cotizar-api 2>/dev/null || true

            # Systemd service
            NODE_BIN=$(command -v node)
            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=0.0.0.0
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF
            sed -i 's/^            //' /etc/systemd/system/cotizar.service
            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar

            # Health check with rollback
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://localhost:$DEPLOY_PORT/cotizar/health" >/dev/null 2>&1; then
                HEALTHY=true; echo "Health OK (${i})"; break
              fi
              echo "Waiting... (${i}/15)"; sleep 2
            done

            if ! $HEALTHY; then
              journalctl -u cotizar -n 30 --no-pager 2>/dev/null || true
              if [ "$PREV" != "none" ]; then
                echo "ROLLBACK → $PREV"
                git checkout "$PREV"
                npm ci && npm run build
                systemctl restart cotizar
                sleep 5
              fi
              exit 1
            fi

            # Inject /cotizar proxy into nginx Docker container
            set +e
            NGINX_CTR=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -iE "nginx" | head -1)
            if [ -n "$NGINX_CTR" ]; then
              HOST_GW=$(docker inspect "$NGINX_CTR" -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' 2>/dev/null | head -1)
              [ -z "$HOST_GW" ] && HOST_GW="172.17.0.1"

              # Find main nginx config file
              CONF=$(docker exec "$NGINX_CTR" nginx -T 2>&1 | grep "^# configuration file" | \
                grep -v "nginx.conf:" | head -1 | sed 's/.*file //' | sed 's/://')
              [ -z "$CONF" ] && CONF="/etc/nginx/conf.d/default.conf"

              ALREADY=$(docker exec "$NGINX_CTR" grep -c "cotizar" "$CONF" 2>/dev/null || echo "0")
              if [ "$ALREADY" -eq 0 ]; then
                docker exec "$NGINX_CTR" cat "$CONF" > /tmp/ng.conf
                python3 - "$HOST_GW" "$DEPLOY_PORT" << 'PYEOF'
            import sys, re
            gw, port = sys.argv[1], sys.argv[2]
            block = f"""
            # cotizAR proxy (auto)
            location ^~ /cotizar {{
                proxy_pass http://{gw}:{port}/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }}"""
            content = open('/tmp/ng.conf').read()
            m = re.search(r'^\s*(location\s+/\s*\{)', content, re.MULTILINE)
            if m:
                content = content[:m.start()] + block + '\n' + content[m.start():]
            else:
                srv = re.search(r'server\s*\{', content)
                if srv:
                    depth, i = 0, srv.start()
                    for i in range(srv.start(), len(content)):
                        depth += (content[i]=='{') - (content[i]=='}')
                        if depth == 0: break
                    content = content[:i] + '\n' + block + '\n' + content[i:]
            open('/tmp/ng-mod.conf','w').write(content)
            print('OK')
            PYEOF
                B64=$(base64 -w0 /tmp/ng-mod.conf)
                docker exec "$NGINX_CTR" sh -c "echo '$B64' | base64 -d > $CONF"
                docker exec "$NGINX_CTR" nginx -t 2>/dev/null && \
                  docker exec "$NGINX_CTR" nginx -s reload && \
                  echo "Nginx reloaded with /cotizar proxy"
              else
                echo "Nginx already has /cotizar config"
              fi
            fi
            set -euo pipefail

            git config --global --unset-all "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof" 2>/dev/null || true

            echo ""
            echo "=== DEPLOY COMPLETE ==="
            echo "Branch : $BRANCH"
            echo "Commit : $(git log --oneline -1)"
            echo "Direct : http://localhost:$DEPLOY_PORT/cotizar/"
            echo "Public : https://www.licitometro.ar/cotizar/"

      - name: Smoke test
        if: always()
        run: |
          sleep 8
          BODY=$(curl -sf "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "")
          if echo "$BODY" | grep -q '"status"'; then
            echo "PUBLIC OK: $BODY"
          else
            echo "Direct health not reachable from GitHub runners (may be behind firewall)"
            echo "Response: ${BODY:0:100}"
          fi
