name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"

            echo "=========================================="
            echo "  cotizAR CD - branch: $BRANCH"
            echo "  GH_TOKEN length: ${#GH_TOKEN}"
            echo "=========================================="

            # Validate token
            if [ -z "$GH_TOKEN" ] || [ "${#GH_TOKEN}" -lt 10 ]; then
              echo "ERROR: GH_TOKEN is empty or too short!"
              echo "Check that github.token is properly passed via envs parameter"
              exit 1
            fi

            # Configure git auth - clear any stale credentials
            git config --global --unset-all credential.helper 2>/dev/null || true
            git config --global --unset-all "url.https://x-access-token" 2>/dev/null || true
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

            # Build authenticated URL for direct use
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ==========================================================
            # STEP 0: Pre-flight - licitometro alive?
            # ==========================================================
            echo ""
            echo "--- [0/8] Pre-flight ---"
            LICITO_OK=false
            if curl -sf -o /dev/null -w "" "http://127.0.0.1:80/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP (pre-deploy)"
            elif curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP via HTTPS"
            else
              echo "WARN: cannot reach licitometro (may be normal)"
            fi

            # ==========================================================
            # STEP 1: Ensure Node.js >= 18
            # ==========================================================
            echo ""
            echo "--- [1/8] Node.js ---"
            if command -v node &>/dev/null; then
              NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
              if [ "$NODE_MAJOR" -ge 18 ]; then
                echo "Node $(node -v) OK"
              else
                echo "Node $(node -v) too old, installing 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
              fi
            else
              echo "Node not found, installing 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # ==========================================================
            # STEP 2: Build tools (for better-sqlite3 native addon)
            # ==========================================================
            echo ""
            echo "--- [2/8] Build tools ---"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ==========================================================
            # STEP 3: Clone or update code
            # ==========================================================
            echo ""
            echo "--- [3/8] Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy - cloning..."
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Ensure remote uses authenticated URL
            git remote set-url origin "$REPO_URL" 2>/dev/null || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous: $PREV_COMMIT"

            git fetch origin "$BRANCH" || git fetch origin
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            echo "Now: $(git log --oneline -1)"

            # ==========================================================
            # STEP 4: Build
            # ==========================================================
            echo ""
            echo "--- [4/8] Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "ERROR: build failed"; exit 1; }
            echo "Build OK"

            mkdir -p data bids

            # ==========================================================
            # STEP 5: System user + permissions
            # ==========================================================
            echo ""
            echo "--- [5/8] System user ---"
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
              echo "User 'cotizar' created"
            else
              echo "User 'cotizar' exists"
            fi
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ==========================================================
            # STEP 5b: Stop old cotizar Docker container
            # ==========================================================
            # Old Docker container occupies port 3001, conflicts with systemd
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -qx "cotizar"; then
              echo "Stopping old cotizar Docker container (frees port $DEPLOY_PORT)..."
              docker stop cotizar 2>/dev/null || true
              sleep 2
            fi

            # ==========================================================
            # STEP 6: Systemd service
            # ==========================================================
            echo ""
            echo "--- [6/8] Systemd service ---"
            NODE_BIN=$(command -v node)

            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # fix heredoc indentation
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar
            echo "Service restarted"

            # Health check
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Health OK (attempt $i)"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || true
                break
              fi
              echo "Waiting... ($i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo "!!! SERVICE FAILED TO START !!!"
              journalctl -u cotizar -n 40 --no-pager 2>/dev/null || true

              if [ "$PREV_COMMIT" != "none" ]; then
                echo "ROLLBACK to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT" 2>/dev/null || true
                npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1 && echo "ROLLBACK OK" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            # ==========================================================
            # STEP 7: Inject cotizar proxy into Docker nginx
            # ==========================================================
            echo ""
            echo "--- [7/8] Reverse proxy ---"

            # Architecture: licitometro-nginx-1 Docker container serves
            # ports 80/443. We need to inject location ^~ /cotizar blocks.
            # KEY: If nginx config is BIND-MOUNTED from host, docker cp
            # has no effect (bind mount shadows the overlay). We must
            # modify the HOST file directly in that case.

            PROXY_CONFIGURED=false

            # Quick check: does proxy already work correctly?
            echo "Testing existing proxy..."
            HEALTH_VIA_PROXY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
            if echo "$HEALTH_VIA_PROXY" | grep -q '"status"'; then
              APP_CHECK=$(curl -sf "http://127.0.0.1/cotizar/" 2>/dev/null | head -c 300 || echo "")
              if echo "$APP_CHECK" | grep -qi "cotiz"; then
                echo "  Proxy FULLY WORKING - skip config"
                PROXY_CONFIGURED=true
              else
                echo "  /cotizar/health OK but /cotizar/ returns wrong content"
              fi
            else
              echo "  /cotizar/health not proxied yet"
            fi

            if ! $PROXY_CONFIGURED; then
              echo ""
              echo "=== Injecting cotizar into Docker nginx ==="

              # Find nginx container (multiple patterns)
              NGINX_CONTAINER=""
              for pattern in 'licitometro.*nginx' 'nginx.*licitometro' 'nginx'; do
                NGINX_CONTAINER=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -iE "$pattern" | head -1)
                [ -n "$NGINX_CONTAINER" ] && break
              done

              if [ -z "$NGINX_CONTAINER" ]; then
                echo "ERROR: No nginx container found!"
                docker ps --format 'table {{.Names}}\t{{.Ports}}' 2>/dev/null || true
              else
                echo "Nginx container: $NGINX_CONTAINER"

                # Get host gateway IP
                HOST_GW=""
                CONTAINER_NET=$(docker inspect "$NGINX_CONTAINER" --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null | head -1)
                [ -n "$CONTAINER_NET" ] && HOST_GW=$(docker network inspect "$CONTAINER_NET" -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null)
                [ -z "$HOST_GW" ] && HOST_GW=$(docker network inspect bridge -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null)
                [ -z "$HOST_GW" ] && HOST_GW="172.17.0.1"
                echo "Host gateway: $HOST_GW"

                # Test connectivity from container to cotizar on host
                echo "Testing connectivity..."
                CONN_OK=false
                for TEST_IP in "$HOST_GW" "172.17.0.1" "host.docker.internal" "$(hostname -I 2>/dev/null | awk '{print $1}')"; do
                  [ -z "$TEST_IP" ] && continue
                  if docker exec "$NGINX_CONTAINER" sh -c "wget -q -O- http://${TEST_IP}:${DEPLOY_PORT}/health 2>/dev/null || curl -sf http://${TEST_IP}:${DEPLOY_PORT}/health 2>/dev/null" 2>/dev/null | grep -q '"status"'; then
                    HOST_GW="$TEST_IP"
                    echo "  OK via $HOST_GW"
                    CONN_OK=true
                    break
                  fi
                done
                if ! $CONN_OK; then
                  echo "  WARN: Cannot verify path, using $HOST_GW"
                fi

                # === CRITICAL: Detect BIND MOUNTS ===
                echo ""
                echo "Detecting config strategy..."
                MOUNT_INFO=$(docker inspect "$NGINX_CONTAINER" --format '{{range .Mounts}}{{.Type}}|{{.Source}}|{{.Destination}}{{"\n"}}{{end}}' 2>/dev/null)
                echo "Mounts:"
                echo "$MOUNT_INFO" | grep -v '^$' | while read -r line; do echo "  $line"; done

                HOST_CONF_PATH=""
                CONTAINER_CONF_PATH=""
                USE_BIND_MOUNT=false

                # Check each bind mount for nginx config
                while IFS='|' read -r mtype msource mdest; do
                  [ -z "$mtype" ] && continue
                  [ "$mtype" != "bind" ] && continue
                  case "$mdest" in
                    */nginx/conf.d/*|*/nginx/conf.d|*/nginx/*.conf|*/nginx/nginx.conf)
                      if [ -f "$msource" ] && grep -q "server" "$msource" 2>/dev/null; then
                        HOST_CONF_PATH="$msource"
                        CONTAINER_CONF_PATH="$mdest"
                        echo "  >> BIND MOUNT (file): $msource -> $mdest"
                      elif [ -d "$msource" ]; then
                        for cf in "$msource"/default.conf "$msource"/*.conf; do
                          if [ -f "$cf" ] && grep -q "location" "$cf" 2>/dev/null; then
                            HOST_CONF_PATH="$cf"
                            CONTAINER_CONF_PATH="$mdest/$(basename "$cf")"
                            echo "  >> BIND MOUNT (dir): $cf -> $CONTAINER_CONF_PATH"
                            break
                          fi
                        done
                      fi
                      ;;
                  esac
                done <<< "$MOUNT_INFO"

                # Fallback: search common host paths for licitometro nginx config
                if [ -z "$HOST_CONF_PATH" ]; then
                  echo "  No bind mount found, searching host filesystem..."
                  COMPOSE_DIR=$(docker inspect "$NGINX_CONTAINER" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null)
                  echo "  Compose dir: ${COMPOSE_DIR:-unknown}"
                  for candidate in \
                    "${COMPOSE_DIR}/nginx/conf.d/default.conf" \
                    "${COMPOSE_DIR}/nginx/default.conf" \
                    "${COMPOSE_DIR}/nginx.conf" \
                    /opt/licitometro/nginx/conf.d/default.conf \
                    /opt/licitometro/nginx/default.conf \
                    /opt/licitometro/nginx.conf \
                    /root/licitometro/nginx/conf.d/default.conf \
                    /root/licitometro/nginx/default.conf; do
                    [ -z "$candidate" ] && continue
                    if [ -f "$candidate" ] && grep -q "server" "$candidate" 2>/dev/null; then
                      HOST_CONF_PATH="$candidate"
                      echo "  >> Found host config: $HOST_CONF_PATH"
                      break
                    fi
                  done
                fi

                if [ -n "$HOST_CONF_PATH" ]; then
                  USE_BIND_MOUNT=true
                  echo "Strategy: MODIFY HOST FILE ($HOST_CONF_PATH)"
                  cp "$HOST_CONF_PATH" /tmp/nginx-original.conf
                else
                  echo "Strategy: DOCKER CP (no bind mount detected)"
                  # Find config inside container
                  CONTAINER_CONF_PATH=""
                  for f in /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/licitometro.conf /etc/nginx/conf.d/app.conf; do
                    if docker exec "$NGINX_CONTAINER" test -f "$f" 2>/dev/null; then
                      CONTAINER_CONF_PATH="$f"
                      break
                    fi
                  done
                  if [ -z "$CONTAINER_CONF_PATH" ]; then
                    CONTAINER_CONF_PATH=$(docker exec "$NGINX_CONTAINER" sh -c "nginx -T 2>&1 | grep '# configuration file' | grep -v nginx.conf: | head -1 | sed 's/.*file //' | sed 's/:.*//'" 2>/dev/null)
                  fi
                  [ -z "$CONTAINER_CONF_PATH" ] && CONTAINER_CONF_PATH="/etc/nginx/conf.d/default.conf"
                  echo "  Container config: $CONTAINER_CONF_PATH"
                  docker cp "$NGINX_CONTAINER":"$CONTAINER_CONF_PATH" /tmp/nginx-original.conf 2>/dev/null
                fi

                if [ -f /tmp/nginx-original.conf ]; then
                  echo ""
                  echo "Original config stats:"
                  echo "  Size: $(wc -c < /tmp/nginx-original.conf) bytes, $(wc -l < /tmp/nginx-original.conf) lines"
                  echo "  Locations:"
                  grep -n "location" /tmp/nginx-original.conf 2>/dev/null | head -20 || echo "  (none)"

                  # Python3 to safely inject location blocks
                  HOST_GW_VAL="$HOST_GW" DEPLOY_PORT_VAL="$DEPLOY_PORT" python3 << 'PYEOF'
            import re, os, sys

            HOST_GW = os.environ['HOST_GW_VAL']
            PORT = os.environ['DEPLOY_PORT_VAL']
            UPSTREAM = f'{HOST_GW}:{PORT}'

            # nginx location blocks - using simple string (NOT f-string)
            # to avoid issues with nginx $ variables and { } braces
            COTIZAR_BLOCK = """
            # BEGIN COTIZAR PROXY (auto-managed by cotizAR CD)
            location ^~ /cotizar/api/ {
                proxy_pass http://UPSTREAM_PLACEHOLDER/cotizar/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 30s;
            }
            location ^~ /cotizar/config/ {
                proxy_pass http://UPSTREAM_PLACEHOLDER/cotizar/config/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            location ^~ /cotizar/health {
                proxy_pass http://UPSTREAM_PLACEHOLDER/health;
                proxy_http_version 1.1;
            }
            location ^~ /cotizar {
                proxy_pass http://UPSTREAM_PLACEHOLDER/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            # END COTIZAR PROXY
            """.replace('UPSTREAM_PLACEHOLDER', UPSTREAM)

            # Dedent
            lines = COTIZAR_BLOCK.split('\n')
            non_empty = [l for l in lines if l.strip()]
            if non_empty:
                min_indent = min(len(l) - len(l.lstrip()) for l in non_empty)
                COTIZAR_BLOCK = '\n'.join(l[min_indent:] if len(l) >= min_indent else l for l in lines)

            with open('/tmp/nginx-original.conf', 'r') as f:
                content = f.read()

            print(f'Original: {len(content)} bytes, {content.count(chr(10))} lines')

            # Remove existing cotizar blocks (marked)
            content = re.sub(r'\s*# BEGIN COTIZAR PROXY.*?# END COTIZAR PROXY\s*', '\n', content, flags=re.DOTALL)

            # Remove any standalone cotizar location blocks
            raw_lines = content.split('\n')
            clean_lines = []
            skip_depth = 0
            for line in raw_lines:
                stripped = line.strip()
                if skip_depth == 0 and re.match(r'location\s+.*?/cotizar', stripped):
                    skip_depth = line.count('{') - line.count('}')
                    if skip_depth <= 0:
                        skip_depth = 0
                    continue
                if skip_depth > 0:
                    skip_depth += line.count('{') - line.count('}')
                    if skip_depth <= 0:
                        skip_depth = 0
                    continue
                clean_lines.append(line)
            content = '\n'.join(clean_lines)
            content = re.sub(r'\n{3,}', '\n\n', content)

            # Find insertion point: before "location / {" catch-all
            match = re.search(r'^([ \t]*)(location\s+/\s*\{)', content, re.MULTILINE)
            if match:
                pos = match.start()
                indent = match.group(1)
                block_lines = COTIZAR_BLOCK.strip().split('\n')
                block = '\n'.join(indent + l.strip() if l.strip() else '' for l in block_lines)
                content = content[:pos] + block + '\n\n' + content[pos:]
                print(f'Inserted BEFORE "location /" at char {pos}')
            else:
                # Fallback: before closing brace of first server block
                print('WARN: No "location / {" found, inserting at server block end')
                srv = re.search(r'server\s*\{', content)
                if srv:
                    depth = 0
                    for i in range(srv.start(), len(content)):
                        if content[i] == '{': depth += 1
                        elif content[i] == '}':
                            depth -= 1
                            if depth == 0:
                                block = '\n' + COTIZAR_BLOCK.strip() + '\n'
                                content = content[:i] + block + content[i:]
                                print(f'Inserted at end of server block (pos {i})')
                                break
                else:
                    print('ERROR: No server block found!')
                    sys.exit(1)

            with open('/tmp/nginx-modified.conf', 'w') as f:
                f.write(content)

            print(f'Modified: {len(content)} bytes')
            for i, line in enumerate(content.split('\n'), 1):
                if 'cotizar' in line.lower() or '^~' in line:
                    print(f'  L{i}: {line.rstrip()}')
            print('Config modified OK')
            PYEOF

                  PYEXIT=$?
                  echo "Python exit: $PYEXIT"

                  if [ "$PYEXIT" -eq 0 ] && [ -f /tmp/nginx-modified.conf ]; then
                    # Write to the right location
                    if $USE_BIND_MOUNT; then
                      echo "Writing to HOST file: $HOST_CONF_PATH"
                      cp /tmp/nginx-modified.conf "$HOST_CONF_PATH"
                      echo "  Written $(wc -c < "$HOST_CONF_PATH") bytes"
                    else
                      echo "Docker-cp to $NGINX_CONTAINER:$CONTAINER_CONF_PATH"
                      docker cp /tmp/nginx-modified.conf "$NGINX_CONTAINER":"$CONTAINER_CONF_PATH"
                    fi

                    # Test nginx config
                    echo "Testing nginx config..."
                    NGINX_TEST=$(docker exec "$NGINX_CONTAINER" nginx -t 2>&1)
                    echo "$NGINX_TEST"

                    if echo "$NGINX_TEST" | grep -q "successful"; then
                      docker exec "$NGINX_CONTAINER" nginx -s reload
                      echo "NGINX RELOADED"
                      sleep 3

                      # Verify proxy
                      VERIFY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                      if echo "$VERIFY" | grep -q '"status"'; then
                        echo "VERIFIED: /cotizar/health returns cotizar JSON"
                        PROXY_CONFIGURED=true
                      else
                        echo "WARN: /cotizar/health still not working after reload"
                        echo "  Response: $(curl -sf -o /dev/null -w 'HTTP %{http_code}' 'http://127.0.0.1/cotizar/health' 2>/dev/null || echo 'no response')"
                        echo "  Checking active nginx config for cotizar..."
                        docker exec "$NGINX_CONTAINER" nginx -T 2>&1 | grep -B1 -A3 "cotizar" | head -20 || true
                      fi
                    else
                      echo "NGINX CONFIG INVALID - restoring original"
                      if $USE_BIND_MOUNT; then
                        cp /tmp/nginx-original.conf "$HOST_CONF_PATH"
                      else
                        docker cp /tmp/nginx-original.conf "$NGINX_CONTAINER":"$CONTAINER_CONF_PATH"
                      fi
                      docker exec "$NGINX_CONTAINER" nginx -s reload 2>/dev/null || true
                    fi
                  else
                    echo "Python config modification FAILED (exit $PYEXIT)"
                  fi
                else
                  echo "ERROR: Could not read nginx config file"
                  echo "Trying direct nginx -T dump..."
                  docker exec "$NGINX_CONTAINER" nginx -T 2>&1 | head -50 || true
                fi
              fi

              echo ""
              if $PROXY_CONFIGURED; then
                echo "PROXY STATUS: CONFIGURED AND VERIFIED"
              else
                echo "========================================"
                echo "WARNING: Auto-config failed"
                echo "cotizar runs on port $DEPLOY_PORT (direct)"
                echo "Need manual nginx config for /cotizar proxy"
                echo "========================================"
              fi
            fi

            # ==========================================================
            # STEP 8: Final verification
            # ==========================================================
            echo ""
            echo "--- [8/8] Verify ---"

            # Direct service check
            echo -n "Direct health (port $DEPLOY_PORT): "
            curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null && echo "" || echo "FAIL"

            echo -n "Direct API (port $DEPLOY_PORT): "
            curl -sf -o /dev/null -w "HTTP %{http_code}" "http://127.0.0.1:$DEPLOY_PORT/cotizar/api/tenders" 2>/dev/null || echo "FAIL"
            echo ""

            # Proxy check (via Docker nginx on port 80)
            echo -n "Proxy /cotizar/health (port 80): "
            HEALTH_BODY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "FAIL")
            echo "$HEALTH_BODY"
            if echo "$HEALTH_BODY" | grep -q '"status"'; then
              echo "PROXY OK - cotizar accessible via licitometro.ar/cotizar"
            else
              echo "WARN: proxy not returning cotizar health JSON"
              echo "DIAG: Docker nginx config for cotizar:"
              NGINX_C=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -E 'licitometro.*nginx' | head -1)
              [ -n "$NGINX_C" ] && docker exec "$NGINX_C" grep -n "cotizar" /etc/nginx/conf.d/default.conf 2>/dev/null || echo "(not found)"
            fi

            echo -n "Proxy /cotizar (port 80): "
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1/cotizar/" 2>/dev/null || echo "000")
            echo "HTTP $STATUS"

            # Licitometro still alive
            if $LICITO_OK; then
              echo -n "licitometro.ar post-deploy: "
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "STILL ALIVE"
              else
                echo "WARNING - CHECK NOW"
              fi
            fi

            # Cleanup: remove git token from global config
            git config --global --unset-all url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "  DEPLOY COMPLETE"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Smoke test from outside
        if: always()
        run: |
          echo "Checking public URL..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "000")
          echo "https://www.licitometro.ar/cotizar/health -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "PUBLIC HEALTH CHECK: OK"
          else
            echo "Public health check failed (HTTP $STATUS) - may need manual nginx config"
          fi
