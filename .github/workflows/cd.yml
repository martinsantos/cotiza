name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_DIR,DEPLOY_PORT
          command_timeout: 20m
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            echo "========================================"
            echo "  cotizAR CD → $BRANCH"
            echo "========================================"

            # ── 1. ENVIRONMENT ────────────────────────
            echo ""
            echo "--- Environment ---"
            echo "User: $(whoami)"
            echo "Docker: $(docker --version 2>/dev/null || echo NOT FOUND)"
            echo "Docker Compose plugin: $(docker compose version 2>/dev/null || echo NOT FOUND)"
            echo "docker-compose binary: $(docker-compose --version 2>/dev/null || echo NOT FOUND)"
            echo "Nginx: $(nginx -v 2>&1 || echo NOT FOUND)"
            echo "Python3: $(python3 --version 2>/dev/null || echo NOT FOUND)"

            # ── 2. GIT UPDATE ─────────────────────────
            echo ""
            echo "--- Git update ---"
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$DEPLOY_DIR"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # ── 3. DOCKER COMPOSE UP ──────────────────
            echo ""
            echo "--- Docker Compose up ---"
            # Try plugin first, fall back to standalone binary
            if docker compose version &>/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif docker-compose --version &>/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: neither 'docker compose' nor 'docker-compose' found"
              exit 1
            fi
            echo "Using: $COMPOSE"
            $COMPOSE up -d --build cotizar-api
            docker image prune -f 2>/dev/null || true

            # ── 4. HEALTH CHECK ───────────────────────
            echo ""
            echo "--- Health check (port $DEPLOY_PORT) ---"
            HEALTHY=false
            for i in $(seq 1 24); do
              RESP=$(curl -sf "http://localhost:${DEPLOY_PORT}/cotizar/health" 2>/dev/null || echo "")
              echo "  [$i/24] → ${RESP:-EMPTY}"
              if echo "$RESP" | grep -q '"status"'; then
                HEALTHY=true
                echo "  HEALTHY!"
                break
              fi
              sleep 5
            done
            if ! $HEALTHY; then
              echo "ERROR: service not healthy after 120s"
              echo "Docker logs:"
              docker logs cotizar-api --tail 30 2>/dev/null || true
              echo "Port listeners:"
              ss -tlnp 2>/dev/null | grep -E ":${DEPLOY_PORT}|:3000" || true
              exit 1
            fi

            # ── 5. NGINX INJECTION ────────────────────
            echo ""
            echo "--- Nginx proxy injection ---"
            set +e
            PROXY_OK=false

            nginx_reload() {
              nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null
            }

            licit_http() {
              curl -so /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1/" 2>/dev/null || echo "000"
            }

            licit_ok() {
              CODE=$(licit_http)
              [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]
            }

            echo "Licitometro before: HTTP $(licit_http)"

            if ! command -v nginx &>/dev/null; then
              echo "nginx not in PATH — skipping"
            else
              # ── 5a. STRIP all cotizAR blocks from every nginx config ─────────
              # This fixes licitometro if previous runs left broken injection
              echo "Stripping previous cotizAR blocks from all nginx configs..."
              cat > /tmp/nginx_strip.py << 'STRIPEOF'
import re, sys

conf_file = sys.argv[1]
with open(conf_file) as f:
    orig = f.read()

# Strip comment line + location block together (handles nested-safe [^}]* match)
cleaned = re.sub(
    r'[ \t]*# cotizAR managed block[^\n]*\n[ \t]*location\s+\^~\s+/cotizar\s*\{[^}]*\}\n?',
    '', orig, flags=re.DOTALL)
# Also catch orphan location block (no comment)
cleaned = re.sub(
    r'[ \t]*location\s+\^~\s+/cotizar\s*\{[^}]*\}\n?',
    '', cleaned, flags=re.DOTALL)

if cleaned != orig:
    with open(conf_file, 'w') as f:
        f.write(cleaned)
    print(f"Stripped: {conf_file}")
else:
    print(f"Clean (no block found): {conf_file}")
STRIPEOF

              ALL_CONFS=$(nginx -T 2>/dev/null | grep "^# configuration file" | sed 's/.*file //' | sed 's/:.*//' | grep -v '^$' | sort -u)
              STRIPPED_ANY=false
              for c in $ALL_CONFS; do
                [ -f "$c" ] || continue
                if grep -q "cotizAR managed block" "$c" 2>/dev/null || \
                   grep -qE "location\s+\^\~\s+/cotizar" "$c" 2>/dev/null; then
                  cp "$c" "${c}.bak"
                  python3 /tmp/nginx_strip.py "$c" && STRIPPED_ANY=true
                fi
              done

              if $STRIPPED_ANY; then
                echo "Testing nginx after strip..."
                if nginx -t 2>&1; then
                  nginx_reload
                  sleep 2
                  echo "After strip — licitometro: HTTP $(licit_http)"
                else
                  echo "nginx -t failed after strip — restoring stripped files"
                  for c in $ALL_CONFS; do
                    [ -f "${c}.bak" ] && cp "${c}.bak" "$c"
                  done
                  nginx_reload
                fi
              fi

              # ── 5b. CHECK IF PROXY ALREADY WORKS ──────
              PROXY_CHECK=$(curl -sf --max-time 5 "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
              if echo "$PROXY_CHECK" | grep -q '"status"'; then
                echo "Proxy already working: $PROXY_CHECK"
                PROXY_OK=true
              else
                # ── 5c. FIND VHOST CONFIG ─────────────────────
                VHOST_CONF=""
                for c in $ALL_CONFS; do
                  [ -f "$c" ] || continue
                  echo "$c" | grep -q "nginx.conf$" && continue
                  if grep -qE "listen[[:space:]]+80|server_name" "$c" 2>/dev/null; then
                    VHOST_CONF="$c"; echo "Vhost: $VHOST_CONF"; break
                  fi
                done
                if [ -z "$VHOST_CONF" ]; then
                  for c in \
                    /etc/nginx/sites-enabled/default \
                    /etc/nginx/sites-available/default \
                    /etc/nginx/conf.d/default.conf \
                    /etc/nginx/conf.d/licitometro.conf \
                    /etc/nginx/conf.d/licitometro.ar.conf; do
                    if [ -f "$c" ] && grep -qE "server_name|listen" "$c" 2>/dev/null; then
                      VHOST_CONF="$c"; echo "Vhost (fallback): $VHOST_CONF"; break
                    fi
                  done
                fi
                echo "VHOST_CONF=${VHOST_CONF:-NONE}"

                if [ -n "$VHOST_CONF" ]; then
                  # ── 5d. INJECT ──────────────────────────────
                  cat > /tmp/nginx_inject.py << 'INJECTEOF'
import sys, re

conf_file = sys.argv[1]
port = sys.argv[2]

BLOCK = (
    "\n    # cotizAR managed block - DO NOT REMOVE"
    "\n    location ^~ /cotizar {"
    "\n        proxy_pass http://127.0.0.1:" + port + "/cotizar;"
    "\n        proxy_http_version 1.1;"
    "\n        proxy_set_header Host $host;"
    "\n        proxy_set_header X-Real-IP $remote_addr;"
    "\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;"
    "\n        proxy_set_header X-Forwarded-Proto $scheme;"
    "\n        proxy_read_timeout 30s;"
    "\n        proxy_connect_timeout 5s;"
    "\n    }"
)

with open(conf_file) as f:
    content = f.read()

def find_blocks(text):
    blocks = []
    for m in re.finditer(r'\bserver\s*\{', text):
        s = m.start(); depth = 0; p = m.end() - 1
        while p < len(text):
            if text[p] == '{': depth += 1
            elif text[p] == '}':
                depth -= 1
                if depth == 0: blocks.append((s, p + 1)); break
            p += 1
    return blocks

def score(bt):
    s = 0
    if 'root ' in bt or 'root\t' in bt: s += 20
    if 'try_files' in bt: s += 15
    if re.search(r'location\s+/', bt): s += 10
    if re.search(r'listen\s+443', bt): s += 5
    if re.search(r'return\s+30\d', bt): s -= 30
    return s

blocks = find_blocks(content)
print(f"Found {len(blocks)} server block(s)")
if not blocks:
    content += BLOCK + '\n'
    print("Appended")
else:
    scored = sorted([(score(content[s:e]), s, e) for s, e in blocks], reverse=True)
    for sc, s, e in scored:
        print(f"  score={sc}: {content[s:s+50].strip()!r}")
    _, bs, be = scored[0]
    bt = content[bs:be]
    ins = None
    for pat in [r'\n[ \t]*location\s+/\s*\{', r'\n[ \t]*location\s+~', r'\n[ \t]*error_page\b']:
        m = re.search(pat, bt)
        if m:
            ins = bs + m.start()
            print(f"Inserting before: {bt[m.start():m.start()+40].strip()!r}")
            break
    if ins is None:
        ins = be - 1
        print("Inserting before closing }")
    content = content[:ins] + BLOCK + content[ins:]

with open(conf_file, 'w') as f:
    f.write(content)
print(f"Done: {conf_file}")
INJECTEOF

                  cp "$VHOST_CONF" "${VHOST_CONF}.bak"
                  if python3 /tmp/nginx_inject.py "$VHOST_CONF" "$DEPLOY_PORT"; then
                    if nginx -t 2>&1; then
                      nginx_reload && echo "nginx reloaded"
                      sleep 3
                      VERIFY=$(curl -sf --max-time 5 "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                      echo "cotizAR proxy: ${VERIFY:-EMPTY}"
                      LICIT_AFTER=$(licit_http)
                      echo "Licitometro after: HTTP $LICIT_AFTER"
                      if [ "$LICIT_AFTER" = "000" ]; then
                        echo "ERROR: licitometro broken — restoring"
                        cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                        nginx_reload; sleep 2
                        echo "Licitometro restored: HTTP $(licit_http)"
                        echo "=== INJECTED CONFIG (for debug) ==="
                        cat "${VHOST_CONF}.bak"
                      else
                        echo "$VERIFY" | grep -q '"status"' && PROXY_OK=true || PROXY_OK=false
                      fi
                    else
                      echo "nginx -t FAILED — restoring"
                      cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                      nginx_reload 2>/dev/null || true
                    fi
                  else
                    echo "Inject script failed — no changes"
                    cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                  fi
                else
                  echo "VHOST NOT FOUND"
                  nginx -T 2>/dev/null | grep -E "^# configuration file|server_name|listen 80" | head -20
                fi
              fi
            fi

            # ── 6. CLEANUP & SUMMARY ──────────────────
            git config --global --unset-all "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof" 2>/dev/null || true
            set -e
            echo ""
            echo "========================================"
            echo "  SUMMARY"
            echo "========================================"
            echo "Direct health: $(curl -sf http://127.0.0.1:${DEPLOY_PORT}/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTP proxy:    $(curl -sf http://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTPS proxy:   $(curl -sfk https://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "Proxy OK: ${PROXY_OK:-false}"
            echo "Commit: $(git log --oneline -1)"
            echo "========================================"
