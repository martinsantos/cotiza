name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"

            # Configure git to use token for GitHub access
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "=========================================="
            echo "  cotizAR CD - branch: $BRANCH"
            echo "=========================================="

            # ==========================================================
            # STEP 0: Pre-flight - licitometro alive?
            # ==========================================================
            echo ""
            echo "--- [0/8] Pre-flight ---"
            LICITO_OK=false
            if curl -sf -o /dev/null -w "" "http://127.0.0.1:80/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP (pre-deploy)"
            elif curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP via HTTPS"
            else
              echo "WARN: cannot reach licitometro (may be normal)"
            fi

            # ==========================================================
            # STEP 1: Ensure Node.js >= 18
            # ==========================================================
            echo ""
            echo "--- [1/8] Node.js ---"
            if command -v node &>/dev/null; then
              NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
              if [ "$NODE_MAJOR" -ge 18 ]; then
                echo "Node $(node -v) OK"
              else
                echo "Node $(node -v) too old, installing 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
              fi
            else
              echo "Node not found, installing 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # ==========================================================
            # STEP 2: Build tools (for better-sqlite3 native addon)
            # ==========================================================
            echo ""
            echo "--- [2/8] Build tools ---"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ==========================================================
            # STEP 3: Clone or update code
            # ==========================================================
            echo ""
            echo "--- [3/8] Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy - cloning..."
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "https://github.com/${{ github.repository }}.git" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous: $PREV_COMMIT"

            git fetch origin "$BRANCH" || git fetch origin
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            echo "Now: $(git log --oneline -1)"

            # ==========================================================
            # STEP 4: Build
            # ==========================================================
            echo ""
            echo "--- [4/8] Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "ERROR: build failed"; exit 1; }
            echo "Build OK"

            mkdir -p data bids

            # ==========================================================
            # STEP 5: System user + permissions
            # ==========================================================
            echo ""
            echo "--- [5/8] System user ---"
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
              echo "User 'cotizar' created"
            else
              echo "User 'cotizar' exists"
            fi
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ==========================================================
            # STEP 6: Systemd service
            # ==========================================================
            echo ""
            echo "--- [6/8] Systemd service ---"
            NODE_BIN=$(command -v node)

            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # fix heredoc indentation
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar
            echo "Service restarted"

            # Health check
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Health OK (attempt $i)"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || true
                break
              fi
              echo "Waiting... ($i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo "!!! SERVICE FAILED TO START !!!"
              journalctl -u cotizar -n 40 --no-pager 2>/dev/null || true

              if [ "$PREV_COMMIT" != "none" ]; then
                echo "ROLLBACK to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT" 2>/dev/null || true
                npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1 && echo "ROLLBACK OK" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            # ==========================================================
            # STEP 7: Nginx configuration (SAFE - backup + validate)
            # ==========================================================
            echo ""
            echo "--- [7/8] Nginx ---"

            if ! command -v nginx &>/dev/null; then
              echo "nginx not installed, skipping proxy config"
            else
              # Create snippet - use ^~ to take priority over regex locations
              mkdir -p /etc/nginx/snippets
              cat > /etc/nginx/snippets/cotizar.conf << 'NGXEOF'
            # cotizAR reverse proxy - auto-generated by CD pipeline
            # ^~ prefix ensures these match BEFORE any regex location blocks
            location ^~ /cotizar/api/ {
                proxy_pass http://127.0.0.1:3001/cotizar/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 30s;
            }

            location ^~ /cotizar/config/ {
                proxy_pass http://127.0.0.1:3001/cotizar/config/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location ^~ /cotizar/health {
                proxy_pass http://127.0.0.1:3001/health;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location ^~ /cotizar {
                proxy_pass http://127.0.0.1:3001/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            NGXEOF
              sed -i 's/^            //' /etc/nginx/snippets/cotizar.conf
              echo "Snippet created: /etc/nginx/snippets/cotizar.conf"
              cat /etc/nginx/snippets/cotizar.conf

              # Find nginx config for licitometro
              NGINX_CONF=""
              for f in /etc/nginx/sites-enabled/licitometro* \
                       /etc/nginx/sites-enabled/default \
                       /etc/nginx/conf.d/licitometro* \
                       /etc/nginx/conf.d/default.conf; do
                if [ -f "$f" ] 2>/dev/null; then
                  NGINX_CONF="$f"
                  break
                fi
              done

              if [ -z "$NGINX_CONF" ]; then
                NGINX_CONF=$(grep -rl "server_name" /etc/nginx/ 2>/dev/null | grep -v "snippets\|backup\|\.bak" | head -1 || true)
              fi

              if [ -z "$NGINX_CONF" ]; then
                echo "WARN: No nginx server config found. Manual nginx setup needed."
                echo "DIAG: listing nginx configs..."
                ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
                ls -la /etc/nginx/conf.d/ 2>/dev/null || true
              elif grep -q "snippets/cotizar.conf" "$NGINX_CONF" 2>/dev/null; then
                echo "nginx already includes cotizar snippet in $NGINX_CONF"
                echo "DIAG: current cotizar-related lines:"
                grep -n "cotizar" "$NGINX_CONF" 2>/dev/null || true
                nginx -t 2>&1 && nginx -s reload && echo "nginx reloaded" || echo "WARN: nginx reload failed"
              else
                echo "Adding cotizar snippet to $NGINX_CONF..."
                echo "DIAG: current config content:"
                cat -n "$NGINX_CONF"

                # Backup
                BACKUP="$NGINX_CONF.bak.$(date +%s)"
                cp "$NGINX_CONF" "$BACKUP"
                echo "Backup: $BACKUP"

                # Insert include - robust Python insertion
                python3 -c "
            import sys, re

            with open('$NGINX_CONF', 'r') as f:
                content = f.read()
                lines = content.splitlines(True)

            include_line = '    include /etc/nginx/snippets/cotizar.conf;\n'
            inserted = False

            # Strategy 1: insert before any 'location' directive (cotizar needs priority)
            for i, line in enumerate(lines):
                stripped = line.strip()
                if re.match(r'location\s+', stripped):
                    lines.insert(i, '\n' + include_line + '\n')
                    inserted = True
                    print(f'Inserted before line {i+1}: {stripped}')
                    break

            # Strategy 2: insert before last closing brace in server block
            if not inserted:
                brace_depth = 0
                server_start = -1
                for i, line in enumerate(lines):
                    if 'server' in line and '{' in line:
                        server_start = i
                    if '{' in line:
                        brace_depth += line.count('{')
                    if '}' in line:
                        brace_depth -= line.count('}')
                    # When we return to depth 0 after server block, insert before closing
                    if server_start >= 0 and brace_depth == 0:
                        lines.insert(i, '\n' + include_line + '\n')
                        inserted = True
                        print(f'Inserted before server closing brace at line {i+1}')
                        break

            # Strategy 3: insert before the very last }
            if not inserted:
                for i in range(len(lines)-1, -1, -1):
                    if '}' in lines[i]:
                        lines.insert(i, '\n' + include_line + '\n')
                        inserted = True
                        print(f'Inserted before last brace at line {i+1}')
                        break

            if inserted:
                with open('$NGINX_CONF', 'w') as f:
                    f.writelines(lines)
                print('Include inserted OK')
            else:
                print('ERROR: could not find insertion point')
                sys.exit(1)
            " 2>&1 || {
                  echo "WARN: auto-insert failed, restoring backup"
                  cp "$BACKUP" "$NGINX_CONF"
                  echo "Add manually: include /etc/nginx/snippets/cotizar.conf;"
                }

                echo "DIAG: config after insertion:"
                grep -n "cotizar\|location" "$NGINX_CONF" 2>/dev/null || true

                # Validate and reload
                if nginx -t 2>&1; then
                  nginx -s reload
                  echo "nginx reloaded with cotizar config"
                else
                  echo "nginx -t FAILED! Restoring backup..."
                  cp "$BACKUP" "$NGINX_CONF"
                  nginx -t 2>/dev/null && nginx -s reload 2>/dev/null
                  echo "Backup restored. Add snippet manually."
                fi
              fi
            fi

            # ==========================================================
            # STEP 8: Final verification
            # ==========================================================
            echo ""
            echo "--- [8/8] Verify ---"

            # Direct
            echo -n "Direct health: "
            curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null && echo "" || echo "FAIL"

            echo -n "Direct API: "
            curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1:$DEPLOY_PORT/cotizar/api/tenders" 2>/dev/null || echo "FAIL"
            echo ""

            # Via nginx - verify proxy is actually reaching cotizar (not licitometro SPA)
            echo -n "Nginx /cotizar/health: "
            HEALTH_BODY=$(curl -sf "http://localhost/cotizar/health" 2>/dev/null || echo "FAIL")
            echo "$HEALTH_BODY"
            if echo "$HEALTH_BODY" | grep -q '"status"'; then
              echo "PROXY OK - cotizar is responding through nginx"
            else
              echo "WARN: /cotizar/health did not return JSON - nginx may not be proxying correctly"
              echo "DIAG: checking nginx config for cotizar includes..."
              grep -rn "cotizar" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || true
              echo "DIAG: response body preview:"
              curl -sf "http://localhost/cotizar/health" 2>/dev/null | head -c 200 || true
              echo ""
            fi

            echo -n "Nginx /cotizar: "
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost/cotizar/" 2>/dev/null || echo "000")
            echo "HTTP $STATUS"

            # Licitometro still alive
            if $LICITO_OK; then
              echo -n "licitometro.ar post-deploy: "
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "STILL ALIVE"
              else
                echo "WARNING - CHECK NOW"
              fi
            fi

            # Cleanup: remove git token from global config
            git config --global --unset-all url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "  DEPLOY COMPLETE"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Smoke test from outside
        if: always()
        run: |
          echo "Checking public URL..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "000")
          echo "https://www.licitometro.ar/cotizar/health -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "PUBLIC HEALTH CHECK: OK"
          else
            echo "Public health check failed (HTTP $STATUS) - may need manual nginx config"
          fi
