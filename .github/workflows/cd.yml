name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"

            echo "=========================================="
            echo "  cotizAR CD - branch: $BRANCH"
            echo "  GH_TOKEN length: ${#GH_TOKEN}"
            echo "=========================================="

            # Validate token
            if [ -z "$GH_TOKEN" ] || [ "${#GH_TOKEN}" -lt 10 ]; then
              echo "ERROR: GH_TOKEN is empty or too short!"
              echo "Check that github.token is properly passed via envs parameter"
              exit 1
            fi

            # Configure git auth - clear any stale credentials
            git config --global --unset-all credential.helper 2>/dev/null || true
            git config --global --unset-all "url.https://x-access-token" 2>/dev/null || true
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

            # Build authenticated URL for direct use
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ==========================================================
            # STEP 0: Pre-flight - licitometro alive?
            # ==========================================================
            echo ""
            echo "--- [0/8] Pre-flight ---"
            LICITO_OK=false
            if curl -sf -o /dev/null -w "" "http://127.0.0.1:80/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP (pre-deploy)"
            elif curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP via HTTPS"
            else
              echo "WARN: cannot reach licitometro (may be normal)"
            fi

            # ==========================================================
            # STEP 1: Ensure Node.js >= 18
            # ==========================================================
            echo ""
            echo "--- [1/8] Node.js ---"
            if command -v node &>/dev/null; then
              NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
              if [ "$NODE_MAJOR" -ge 18 ]; then
                echo "Node $(node -v) OK"
              else
                echo "Node $(node -v) too old, installing 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
              fi
            else
              echo "Node not found, installing 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # ==========================================================
            # STEP 2: Build tools (for better-sqlite3 native addon)
            # ==========================================================
            echo ""
            echo "--- [2/8] Build tools ---"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ==========================================================
            # STEP 3: Clone or update code
            # ==========================================================
            echo ""
            echo "--- [3/8] Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy - cloning..."
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Ensure remote uses authenticated URL
            git remote set-url origin "$REPO_URL" 2>/dev/null || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous: $PREV_COMMIT"

            git fetch origin "$BRANCH" || git fetch origin
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            echo "Now: $(git log --oneline -1)"

            # ==========================================================
            # STEP 4: Build
            # ==========================================================
            echo ""
            echo "--- [4/8] Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "ERROR: build failed"; exit 1; }
            echo "Build OK"

            mkdir -p data bids

            # ==========================================================
            # STEP 5: System user + permissions
            # ==========================================================
            echo ""
            echo "--- [5/8] System user ---"
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
              echo "User 'cotizar' created"
            else
              echo "User 'cotizar' exists"
            fi
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ==========================================================
            # STEP 6: Systemd service
            # ==========================================================
            echo ""
            echo "--- [6/8] Systemd service ---"
            NODE_BIN=$(command -v node)

            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # fix heredoc indentation
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar
            echo "Service restarted"

            # Health check
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Health OK (attempt $i)"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || true
                break
              fi
              echo "Waiting... ($i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo "!!! SERVICE FAILED TO START !!!"
              journalctl -u cotizar -n 40 --no-pager 2>/dev/null || true

              if [ "$PREV_COMMIT" != "none" ]; then
                echo "ROLLBACK to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT" 2>/dev/null || true
                npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1 && echo "ROLLBACK OK" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            # ==========================================================
            # STEP 7: Reverse proxy config (auto-detect web server)
            # ==========================================================
            echo ""
            echo "--- [7/8] Reverse proxy ---"

            # Detect what web server is running
            echo "=== WEB SERVER DETECTION ==="
            echo "Processes on port 80/443:"
            ss -tlnp 2>/dev/null | grep -E ':80\s|:443\s' || netstat -tlnp 2>/dev/null | grep -E ':80\s|:443\s' || echo "(could not detect)"
            echo ""
            echo "Installed web servers:"
            for cmd in nginx apache2 httpd caddy; do
              if command -v $cmd &>/dev/null; then
                echo "  $cmd: $($cmd -v 2>&1 || echo 'found')"
              fi
            done
            echo ""
            echo "Docker containers:"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' 2>/dev/null || echo "(docker not available or no containers)"
            echo ""
            echo "Running services:"
            systemctl list-units --type=service --state=running 2>/dev/null | grep -iE 'nginx|apache|httpd|caddy|docker|proxy' || echo "(none matching)"
            echo "=== END DETECTION ==="

            PROXY_CONFIGURED=false

            # ---- NGINX ----
            if command -v nginx &>/dev/null; then
              echo ""
              echo "Configuring NGINX..."
              nginx -T 2>&1 || true

              python3 << 'PYEOF'
            import subprocess, re, os, sys, shutil
            from datetime import datetime

            COTIZAR_BLOCK = """
            # BEGIN COTIZAR PROXY (auto-managed by CD)
            location ^~ /cotizar/api/ {
                proxy_pass http://127.0.0.1:3001/cotizar/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 30s;
            }
            location ^~ /cotizar/config/ {
                proxy_pass http://127.0.0.1:3001/cotizar/config/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            location ^~ /cotizar/health {
                proxy_pass http://127.0.0.1:3001/health;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }
            location ^~ /cotizar {
                proxy_pass http://127.0.0.1:3001/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            # END COTIZAR PROXY
            """
            lines_raw = COTIZAR_BLOCK.split('\n')
            min_indent = min((len(l) - len(l.lstrip()) for l in lines_raw if l.strip()), default=0)
            COTIZAR_BLOCK = '\n'.join(l[min_indent:] for l in lines_raw).strip()

            def run(cmd):
                r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
                return r.stdout + r.stderr

            full = run("nginx -T 2>&1")
            current_file = None
            server_blocks = []
            in_server = has_ssl = has_location = has_root = False
            brace_depth = 0

            for line in full.splitlines():
                m = re.match(r'# configuration file (.+):$', line)
                if m:
                    current_file = m.group(1)
                    continue
                stripped = line.strip()
                if re.match(r'server\s*\{', stripped):
                    in_server, has_ssl, has_location, has_root, brace_depth = True, False, False, False, 0
                if in_server:
                    brace_depth += line.count('{') - line.count('}')
                    if 'ssl' in stripped: has_ssl = True
                    if re.match(r'location\s+', stripped): has_location = True
                    if re.match(r'root\s+', stripped) or 'try_files' in stripped: has_root = True
                    if brace_depth <= 0 and '}' in line:
                        server_blocks.append({'file': current_file, 'ssl': has_ssl, 'location': has_location, 'root': has_root})
                        in_server = False

            print(f"Found {len(server_blocks)} server blocks:")
            for sb in server_blocks:
                print(f"  {sb['file']} ssl={sb['ssl']} loc={sb['location']} root={sb['root']}")

            target_files = set()
            for sb in server_blocks:
                if sb['ssl'] and (sb['location'] or sb['root']) and sb['file']:
                    target_files.add(sb['file'])
            if not target_files:
                for sb in server_blocks:
                    if (sb['location'] or sb['root']) and sb['file']:
                        target_files.add(sb['file'])
            if not target_files:
                for sb in server_blocks:
                    if sb['file']:
                        target_files.add(sb['file'])
            if not target_files:
                for d in ['/etc/nginx/sites-enabled', '/etc/nginx/conf.d']:
                    if os.path.isdir(d):
                        for f in sorted(os.listdir(d)):
                            fp = os.path.join(d, f)
                            if not f.endswith('.bak') and (os.path.isfile(fp) or os.path.islink(fp)):
                                target_files.add(os.path.realpath(fp))

            if not target_files:
                print("No nginx configs found")
                sys.exit(1)

            modified = 0
            for conf_path in sorted(target_files):
                if '.bak' in conf_path: continue
                with open(conf_path, 'r') as f:
                    original = f.read()
                cleaned = re.sub(r'\n?\s*include\s+/etc/nginx/snippets/cotizar\.conf;\s*\n?', '\n', original)
                cleaned = re.sub(r'\s*# BEGIN COTIZAR PROXY.*?# END COTIZAR PROXY\s*', '', cleaned, flags=re.DOTALL)
                lines = cleaned.splitlines(True)
                new_lines, i, inserted = [], 0, False
                while i < len(lines):
                    if re.match(r'server\s*\{', lines[i].strip()):
                        depth, block, j, first_loc = 0, [], i, -1
                        while j < len(lines):
                            block.append(lines[j])
                            depth += lines[j].count('{') - lines[j].count('}')
                            if re.match(r'\s*location\s+', lines[j].strip()) and first_loc < 0:
                                first_loc = len(block) - 1
                            if depth <= 0 and j > i: break
                            j += 1
                        insert_at = first_loc if first_loc >= 0 else len(block) - 1
                        for k, bl in enumerate(block):
                            if k == insert_at:
                                new_lines.append('\n')
                                for cl in COTIZAR_BLOCK.splitlines():
                                    new_lines.append('    ' + cl + '\n')
                                new_lines.append('\n')
                                inserted = True
                            new_lines.append(bl)
                        i = j + 1
                        continue
                    new_lines.append(lines[i])
                    i += 1
                if inserted:
                    shutil.copy2(conf_path, f"{conf_path}.bak.{datetime.now().strftime('%s')}")
                    with open(conf_path, 'w') as f:
                        f.writelines(new_lines)
                    modified += 1
                    print(f"Modified: {conf_path}")
            print(f"Total modified: {modified}")
            sys.exit(0 if modified > 0 else 1)
            PYEOF

              if [ $? -eq 0 ] && nginx -t 2>&1; then
                nginx -s reload
                sleep 2
                if curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null | grep -q "status"; then
                  echo "NGINX PROXY OK"
                  PROXY_CONFIGURED=true
                fi
              fi
            fi

            # ---- APACHE ----
            if ! $PROXY_CONFIGURED && (command -v apache2 &>/dev/null || command -v httpd &>/dev/null); then
              echo ""
              echo "Configuring APACHE..."
              APACHE_CMD=$(command -v apache2 || command -v httpd)

              # Enable required modules
              a2enmod proxy proxy_http 2>/dev/null || true

              # Write cotizar proxy config
              cat > /etc/apache2/conf-available/cotizar.conf 2>/dev/null || cat > /etc/httpd/conf.d/cotizar.conf 2>/dev/null << 'APEOF'
            # cotizAR reverse proxy (auto-managed by CD)
            ProxyPreserveHost On

            # API routes
            ProxyPass /cotizar/api/ http://127.0.0.1:3001/cotizar/api/
            ProxyPassReverse /cotizar/api/ http://127.0.0.1:3001/cotizar/api/

            # Config routes
            ProxyPass /cotizar/config/ http://127.0.0.1:3001/cotizar/config/
            ProxyPassReverse /cotizar/config/ http://127.0.0.1:3001/cotizar/config/

            # Health check
            ProxyPass /cotizar/health http://127.0.0.1:3001/health
            ProxyPassReverse /cotizar/health http://127.0.0.1:3001/health

            # Main app (must be last)
            ProxyPass /cotizar http://127.0.0.1:3001/cotizar
            ProxyPassReverse /cotizar http://127.0.0.1:3001/cotizar
            APEOF
              sed -i 's/^            //' /etc/apache2/conf-available/cotizar.conf 2>/dev/null || true
              sed -i 's/^            //' /etc/httpd/conf.d/cotizar.conf 2>/dev/null || true

              # Enable on Debian/Ubuntu
              a2enconf cotizar 2>/dev/null || true

              if apache2ctl configtest 2>&1 || httpd -t 2>&1; then
                systemctl reload apache2 2>/dev/null || systemctl reload httpd 2>/dev/null
                sleep 2
                if curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null | grep -q "status"; then
                  echo "APACHE PROXY OK"
                  PROXY_CONFIGURED=true
                else
                  echo "Apache reloaded but proxy test failed"
                fi
              else
                echo "Apache config test failed"
              fi
            fi

            # ---- CADDY ----
            if ! $PROXY_CONFIGURED && command -v caddy &>/dev/null; then
              echo ""
              echo "Configuring CADDY..."
              echo "Caddy config location:"
              find /etc/caddy -type f 2>/dev/null || echo "(no /etc/caddy)"
              cat /etc/caddy/Caddyfile 2>/dev/null || true

              # Caddy: append reverse proxy to Caddyfile
              if [ -f /etc/caddy/Caddyfile ]; then
                if ! grep -q "cotizar" /etc/caddy/Caddyfile; then
                  # Add handle block for cotizar
                  python3 -c "
            import re
            with open('/etc/caddy/Caddyfile', 'r') as f:
                content = f.read()
            # Add cotizar proxy before the last closing brace or at end
            block = '''
                # BEGIN COTIZAR PROXY
                handle_path /cotizar/health {
                    reverse_proxy 127.0.0.1:3001
                }
                handle /cotizar/* {
                    reverse_proxy 127.0.0.1:3001
                }
                handle /cotizar {
                    reverse_proxy 127.0.0.1:3001
                }
                # END COTIZAR PROXY
            '''
            import textwrap
            block = textwrap.dedent(block)
            # Insert before the last }
            idx = content.rfind('}')
            if idx > 0:
                content = content[:idx] + block + '\n' + content[idx:]
            else:
                content += block
            with open('/etc/caddy/Caddyfile', 'w') as f:
                f.write(content)
            print('Caddyfile updated')
            "
                fi
                caddy validate --config /etc/caddy/Caddyfile 2>&1 || true
                systemctl reload caddy 2>/dev/null || caddy reload 2>/dev/null
                sleep 2
                if curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null | grep -q "status"; then
                  echo "CADDY PROXY OK"
                  PROXY_CONFIGURED=true
                fi
              fi
            fi

            # ---- NO WEB SERVER FOUND ----
            if ! $PROXY_CONFIGURED; then
              echo ""
              echo "========================================"
              echo "WARNING: No reverse proxy configured!"
              echo "cotizar is running on port $DEPLOY_PORT"
              echo "but no web server (nginx/apache/caddy)"
              echo "was found or could be configured."
              echo ""
              echo "cotizar direct access works:"
              echo "  http://<server-ip>:$DEPLOY_PORT/health"
              echo "  http://<server-ip>:$DEPLOY_PORT/cotizar"
              echo ""
              echo "To fix: install nginx and re-run deploy,"
              echo "or manually configure your web server to"
              echo "proxy /cotizar/* to 127.0.0.1:$DEPLOY_PORT"
              echo "========================================"
            fi

            # ==========================================================
            # STEP 8: Final verification
            # ==========================================================
            echo ""
            echo "--- [8/8] Verify ---"

            # Direct
            echo -n "Direct health: "
            curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null && echo "" || echo "FAIL"

            echo -n "Direct API: "
            curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1:$DEPLOY_PORT/cotizar/api/tenders" 2>/dev/null || echo "FAIL"
            echo ""

            # Via nginx - verify proxy is actually reaching cotizar (not licitometro SPA)
            echo -n "Nginx /cotizar/health: "
            HEALTH_BODY=$(curl -sf "http://localhost/cotizar/health" 2>/dev/null || echo "FAIL")
            echo "$HEALTH_BODY"
            if echo "$HEALTH_BODY" | grep -q '"status"'; then
              echo "PROXY OK - cotizar is responding through nginx"
            else
              echo "WARN: /cotizar/health did not return JSON - nginx may not be proxying correctly"
              echo "DIAG: checking nginx config for cotizar includes..."
              grep -rn "cotizar" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || true
              echo "DIAG: response body preview:"
              curl -sf "http://localhost/cotizar/health" 2>/dev/null | head -c 200 || true
              echo ""
            fi

            echo -n "Nginx /cotizar: "
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost/cotizar/" 2>/dev/null || echo "000")
            echo "HTTP $STATUS"

            # Licitometro still alive
            if $LICITO_OK; then
              echo -n "licitometro.ar post-deploy: "
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "STILL ALIVE"
              else
                echo "WARNING - CHECK NOW"
              fi
            fi

            # Cleanup: remove git token from global config
            git config --global --unset-all url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "  DEPLOY COMPLETE"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Smoke test from outside
        if: always()
        run: |
          echo "Checking public URL..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "000")
          echo "https://www.licitometro.ar/cotizar/health -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "PUBLIC HEALTH CHECK: OK"
          else
            echo "Public health check failed (HTTP $STATUS) - may need manual nginx config"
          fi
