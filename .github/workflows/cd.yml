name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GH_TOKEN,DEPLOY_DIR,DEPLOY_PORT
          command_timeout: 20m
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            echo "========================================"
            echo "  cotizAR CD → $BRANCH"
            echo "========================================"

            # ── 1. ENVIRONMENT ────────────────────────
            echo ""
            echo "--- Environment ---"
            echo "User: $(whoami)"
            echo "Docker: $(docker --version 2>/dev/null || echo NOT FOUND)"
            echo "Docker Compose plugin: $(docker compose version 2>/dev/null || echo NOT FOUND)"
            echo "docker-compose binary: $(docker-compose --version 2>/dev/null || echo NOT FOUND)"
            echo "Nginx: $(nginx -v 2>&1 || echo NOT FOUND)"
            echo "Python3: $(python3 --version 2>/dev/null || echo NOT FOUND)"

            # ── 2. GIT UPDATE ─────────────────────────
            echo ""
            echo "--- Git update ---"
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$DEPLOY_DIR"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "Commit: $(git log --oneline -1)"

            # ── 3. DOCKER COMPOSE UP ──────────────────
            echo ""
            echo "--- Docker Compose up ---"
            # Try plugin first, fall back to standalone binary
            if docker compose version &>/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif docker-compose --version &>/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "ERROR: neither 'docker compose' nor 'docker-compose' found"
              exit 1
            fi
            echo "Using: $COMPOSE"
            $COMPOSE up -d --build cotizar-api
            docker image prune -f 2>/dev/null || true

            # ── 4. HEALTH CHECK ───────────────────────
            echo ""
            echo "--- Health check (port $DEPLOY_PORT) ---"
            HEALTHY=false
            for i in $(seq 1 24); do
              RESP=$(curl -sf "http://localhost:${DEPLOY_PORT}/cotizar/health" 2>/dev/null || echo "")
              echo "  [$i/24] → ${RESP:-EMPTY}"
              if echo "$RESP" | grep -q '"status"'; then
                HEALTHY=true
                echo "  HEALTHY!"
                break
              fi
              sleep 5
            done
            if ! $HEALTHY; then
              echo "ERROR: service not healthy after 120s"
              echo "Docker logs:"
              docker logs cotizar-api --tail 30 2>/dev/null || true
              echo "Port listeners:"
              ss -tlnp 2>/dev/null | grep -E ":${DEPLOY_PORT}|:3000" || true
              exit 1
            fi

            # ── 5. NGINX INJECTION ────────────────────
            echo ""
            echo "--- Nginx proxy injection ---"
            set +e

            # Already working?
            PROXY_CHECK=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
            if echo "$PROXY_CHECK" | grep -q '"status"'; then
              echo "Proxy already working: $PROXY_CHECK"
              PROXY_OK=true
            else
              PROXY_OK=false

              if ! command -v nginx &>/dev/null; then
                echo "nginx command not found in PATH — skipping injection"
              else
                echo "nginx is at: $(which nginx)"
                echo "All nginx config files:"
                nginx -T 2>/dev/null | grep "^# configuration file" | sed 's/.*file //' | sed 's/:.*//'

                # Write python3 script to disk (avoids heredoc quoting issues)
                cat > /tmp/nginx_inject.py << 'ENDPY'
import sys, re

conf_file = sys.argv[1]
port = sys.argv[2]

BLOCK = """
    # cotizAR managed block - DO NOT REMOVE
    location ^~ /cotizar {
        proxy_pass http://127.0.0.1:""" + port + """/cotizar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }"""

with open(conf_file, 'r') as f:
    content = f.read()

# Remove existing managed blocks
content = re.sub(r'\n\s*# cotizAR managed block.*?(?=\n\s*(?:location\b|#|server\b|\}))',
                 '', content, flags=re.DOTALL)
content = re.sub(r'\n\s*location\s+\^~\s+/cotizar\s*\{[^}]*\}', '', content, flags=re.DOTALL)

# Find best server block (skip redirect-only blocks)
def find_blocks(text):
    blocks = []
    for m in re.finditer(r'\bserver\s*\{', text):
        s = m.start(); depth = 0; p = m.end()-1
        while p < len(text):
            if text[p] == '{': depth += 1
            elif text[p] == '}':
                depth -= 1
                if depth == 0: blocks.append((s, p+1)); break
            p += 1
    return blocks

def score(bt):
    s = 0
    if re.search(r'\broot\b', bt): s += 20
    if re.search(r'\btry_files\b', bt): s += 15
    if re.search(r'location\s+/', bt): s += 10
    if re.search(r'listen\s+443', bt): s += 5
    if re.search(r'return\s+30\d', bt): s -= 30
    return s

blocks = find_blocks(content)
print(f"Found {len(blocks)} server block(s)")
if not blocks:
    content += '\n' + BLOCK + '\n'
    ins_desc = 'appended (no blocks found)'
else:
    scored = sorted([(score(content[s:e]), s, e) for s,e in blocks], reverse=True)
    for sc, s, e in scored:
        print(f"  block score={sc}: {content[s:s+60].strip()[:50]!r}")
    _, bs, be = scored[0]
    bt = content[bs:be]
    ins = None
    for pat in [r'\n[ \t]*location\s+/\s*\{', r'\n[ \t]*location\s+~', r'\n[ \t]*error_page\b']:
        m = re.search(pat, bt)
        if m: ins = bs + m.start(); ins_desc = repr(bt[m.start():m.start()+40].strip()); break
    if ins is None: ins = be - 1; ins_desc = 'before closing }'
    print(f"Inserting before: {ins_desc}")
    content = content[:ins] + '\n' + BLOCK + content[ins:]

with open(conf_file, 'w') as f:
    f.write(content)
print(f"Patched: {conf_file}")
ENDPY

                # Find vhost config
                VHOST_CONF=""
                ALL_CONFS=$(nginx -T 2>/dev/null | grep "^# configuration file" | sed 's/.*file //' | sed 's/:.*//' | grep -v '^$' | sort -u)
                for c in $ALL_CONFS; do
                  [ -f "$c" ] || continue
                  echo "$c" | grep -q "nginx.conf$" && continue
                  if grep -qE "listen[[:space:]]+80|server_name" "$c" 2>/dev/null; then
                    VHOST_CONF="$c"; echo "Vhost found: $VHOST_CONF"; break
                  fi
                done
                if [ -z "$VHOST_CONF" ]; then
                  for c in \
                    /etc/nginx/sites-enabled/default \
                    /etc/nginx/sites-available/default \
                    /etc/nginx/conf.d/default.conf \
                    /etc/nginx/conf.d/licitometro.conf \
                    /etc/nginx/conf.d/licitometro.ar.conf; do
                    if [ -f "$c" ] && grep -qE "server_name|listen" "$c" 2>/dev/null; then
                      VHOST_CONF="$c"; echo "Vhost (fallback): $VHOST_CONF"; break
                    fi
                  done
                fi
                echo "VHOST_CONF=${VHOST_CONF:-NONE}"

                if [ -n "$VHOST_CONF" ]; then
                  cp "$VHOST_CONF" "${VHOST_CONF}.bak"
                  python3 /tmp/nginx_inject.py "$VHOST_CONF" "$DEPLOY_PORT"
                  echo "nginx -t result:"
                  if nginx -t 2>&1; then
                    nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null
                    echo "nginx reloaded OK"
                    sleep 3
                    VERIFY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                    echo "Proxy verify: ${VERIFY:-EMPTY}"
                    echo "$VERIFY" | grep -q '"status"' && PROXY_OK=true || PROXY_OK=false
                  else
                    echo "nginx -t FAILED — restoring backup"
                    cp "${VHOST_CONF}.bak" "$VHOST_CONF"
                    nginx -s reload 2>/dev/null || true
                    echo "Patched file was:"
                    cat "$VHOST_CONF"
                  fi
                else
                  echo "VHOST CONFIG NOT FOUND"
                  echo "Full nginx -T output:"
                  nginx -T 2>/dev/null | grep -E "server_name|listen|location|root|try_files|include" | head -40
                fi
              fi
            fi

            # ── 6. CLEANUP & SUMMARY ──────────────────
            git config --global --unset-all "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof" 2>/dev/null || true
            set -e
            echo ""
            echo "========================================"
            echo "  SUMMARY"
            echo "========================================"
            echo "Direct health: $(curl -sf http://127.0.0.1:${DEPLOY_PORT}/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTP proxy:    $(curl -sf http://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "HTTPS proxy:   $(curl -sfk https://127.0.0.1/cotizar/health 2>/dev/null || echo FAIL)"
            echo "Proxy OK: ${PROXY_OK:-false}"
            echo "Commit: $(git log --oneline -1)"
            echo "========================================"
