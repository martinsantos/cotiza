name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"

            echo "=========================================="
            echo "  cotizAR CD - branch: $BRANCH"
            echo "  GH_TOKEN length: ${#GH_TOKEN}"
            echo "=========================================="

            # Validate token
            if [ -z "$GH_TOKEN" ] || [ "${#GH_TOKEN}" -lt 10 ]; then
              echo "ERROR: GH_TOKEN is empty or too short!"
              echo "Check that github.token is properly passed via envs parameter"
              exit 1
            fi

            # Configure git auth - clear any stale credentials
            git config --global --unset-all credential.helper 2>/dev/null || true
            git config --global --unset-all "url.https://x-access-token" 2>/dev/null || true
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

            # Build authenticated URL for direct use
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ==========================================================
            # STEP 0: Pre-flight - licitometro alive?
            # ==========================================================
            echo ""
            echo "--- [0/8] Pre-flight ---"
            LICITO_OK=false
            if curl -sf -o /dev/null -w "" "http://127.0.0.1:80/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP (pre-deploy)"
            elif curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP via HTTPS"
            else
              echo "WARN: cannot reach licitometro (may be normal)"
            fi

            # ==========================================================
            # STEP 1: Ensure Node.js >= 18
            # ==========================================================
            echo ""
            echo "--- [1/8] Node.js ---"
            if command -v node &>/dev/null; then
              NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
              if [ "$NODE_MAJOR" -ge 18 ]; then
                echo "Node $(node -v) OK"
              else
                echo "Node $(node -v) too old, installing 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
              fi
            else
              echo "Node not found, installing 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # ==========================================================
            # STEP 2: Build tools (for better-sqlite3 native addon)
            # ==========================================================
            echo ""
            echo "--- [2/8] Build tools ---"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ==========================================================
            # STEP 3: Clone or update code
            # ==========================================================
            echo ""
            echo "--- [3/8] Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy - cloning..."
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Ensure remote uses authenticated URL
            git remote set-url origin "$REPO_URL" 2>/dev/null || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous: $PREV_COMMIT"

            git fetch origin "$BRANCH" || git fetch origin
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            echo "Now: $(git log --oneline -1)"

            # ==========================================================
            # STEP 4: Build
            # ==========================================================
            echo ""
            echo "--- [4/8] Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "ERROR: build failed"; exit 1; }
            echo "Build OK"

            mkdir -p data bids

            # ==========================================================
            # STEP 5: System user + permissions
            # ==========================================================
            echo ""
            echo "--- [5/8] System user ---"
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
              echo "User 'cotizar' created"
            else
              echo "User 'cotizar' exists"
            fi
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ==========================================================
            # STEP 5b: Stop old cotizar Docker container
            # ==========================================================
            # Old Docker container occupies port 3001, conflicts with systemd
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -qx "cotizar"; then
              echo "Stopping old cotizar Docker container (frees port $DEPLOY_PORT)..."
              docker stop cotizar 2>/dev/null || true
              sleep 2
            fi

            # ==========================================================
            # STEP 6: Systemd service
            # ==========================================================
            echo ""
            echo "--- [6/8] Systemd service ---"
            NODE_BIN=$(command -v node)

            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # fix heredoc indentation
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar
            echo "Service restarted"

            # Health check
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Health OK (attempt $i)"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || true
                break
              fi
              echo "Waiting... ($i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo "!!! SERVICE FAILED TO START !!!"
              journalctl -u cotizar -n 40 --no-pager 2>/dev/null || true

              if [ "$PREV_COMMIT" != "none" ]; then
                echo "ROLLBACK to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT" 2>/dev/null || true
                npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1 && echo "ROLLBACK OK" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            # ==========================================================
            # STEP 7: Inject cotizar proxy into Docker nginx
            # ==========================================================
            echo ""
            echo "--- [7/8] Reverse proxy ---"

            # Architecture: licitometro-nginx-1 Docker container serves
            # ports 80/443. We inject location ^~ /cotizar blocks into
            # its nginx config with the Docker host gateway as upstream.
            # Host Caddy is only for dev.licitometro.ar previews.

            PROXY_CONFIGURED=false

            # Test if proxy already fully works (both health AND app)
            echo "Testing existing proxy..."
            HEALTH_VIA_PROXY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
            APP_VIA_PROXY=$(curl -sf "http://127.0.0.1/cotizar/" 2>/dev/null | head -c 500 || echo "")

            if echo "$HEALTH_VIA_PROXY" | grep -q '"status"'; then
              echo "  /cotizar/health: OK"
              if echo "$APP_VIA_PROXY" | grep -qi "cotizAR\|Cotizaciones.*Licitaciones"; then
                echo "  /cotizar/: OK (cotizar app)"
                PROXY_CONFIGURED=true
              elif echo "$APP_VIA_PROXY" | grep -qi "No routes matched\|licitometro"; then
                echo "  /cotizar/: WRONG - licitometro SPA catching this route"
              else
                echo "  /cotizar/: HTTP $(curl -sf -o /dev/null -w '%{http_code}' 'http://127.0.0.1/cotizar/' 2>/dev/null || echo '000')"
              fi
            else
              echo "  /cotizar/health: not proxied"
            fi

            if $PROXY_CONFIGURED; then
              echo "Proxy: FULLY WORKING - no changes needed"
            else
              echo ""
              echo "Injecting cotizar proxy into Docker nginx..."

              # Find licitometro nginx container
              NGINX_CONTAINER=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -iE 'licitometro.*nginx' | head -1)

              if [ -z "$NGINX_CONTAINER" ]; then
                echo "ERROR: No licitometro nginx container found"
                docker ps --format 'table {{.Names}}\t{{.Ports}}' 2>/dev/null || true
              else
                echo "Container: $NGINX_CONTAINER"

                # Get host gateway IP (how container reaches host services)
                CONTAINER_NET=$(docker inspect "$NGINX_CONTAINER" --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}}{{end}}' 2>/dev/null | head -1)
                HOST_GW=""
                if [ -n "$CONTAINER_NET" ]; then
                  HOST_GW=$(docker network inspect "$CONTAINER_NET" -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null)
                fi
                [ -z "$HOST_GW" ] && HOST_GW=$(docker network inspect bridge -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null)
                [ -z "$HOST_GW" ] && HOST_GW="172.17.0.1"
                echo "Host gateway: $HOST_GW"

                # Verify connectivity: can container reach cotizar on host?
                echo -n "Connectivity: "
                CONN_OK=false
                for TEST_IP in "$HOST_GW" "host.docker.internal" "$(hostname -I 2>/dev/null | awk '{print $1}')" "172.17.0.1"; do
                  [ -z "$TEST_IP" ] && continue
                  if docker exec "$NGINX_CONTAINER" wget -q -O- "http://${TEST_IP}:${DEPLOY_PORT}/health" 2>/dev/null | grep -q '"status"'; then
                    HOST_GW="$TEST_IP"
                    echo "OK (via $HOST_GW)"
                    CONN_OK=true
                    break
                  fi
                done
                if ! $CONN_OK; then
                  echo "WARN: no direct path found, using $HOST_GW anyway"
                fi

                # Find the nginx config file inside the container
                CONF_FILE=""
                for f in /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/licitometro.conf; do
                  if docker exec "$NGINX_CONTAINER" test -f "$f" 2>/dev/null; then
                    CONF_FILE="$f"
                    break
                  fi
                done
                if [ -z "$CONF_FILE" ]; then
                  CONF_FILE=$(docker exec "$NGINX_CONTAINER" sh -c "nginx -T 2>&1 | grep '# configuration file' | grep -v 'nginx.conf:' | head -1 | sed 's/.*file //' | sed 's/:.*//'" 2>/dev/null)
                fi
                [ -z "$CONF_FILE" ] && CONF_FILE="/etc/nginx/conf.d/default.conf"
                echo "Config: $CONF_FILE"

                # Extract config from container to host
                docker cp "$NGINX_CONTAINER":"$CONF_FILE" /tmp/nginx-original.conf 2>/dev/null

                if [ -f /tmp/nginx-original.conf ]; then
                  echo "Current locations:"
                  grep -n "location" /tmp/nginx-original.conf 2>/dev/null | head -15 || echo "(none)"

                  # Use python3 on the HOST to modify the config safely
                  HOST_GW="$HOST_GW" DEPLOY_PORT="$DEPLOY_PORT" python3 << 'PYEOF'
            import re, os

            HOST_GW = os.environ['HOST_GW']
            PORT = os.environ['DEPLOY_PORT']

            COTIZAR_BLOCK = f"""
                # BEGIN COTIZAR PROXY (auto-managed by cotizAR CD)
                location ^~ /cotizar/api/ {{
                    proxy_pass http://{HOST_GW}:{PORT}/cotizar/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 30s;
                }}
                location ^~ /cotizar/config/ {{
                    proxy_pass http://{HOST_GW}:{PORT}/cotizar/config/;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }}
                location ^~ /cotizar/health {{
                    proxy_pass http://{HOST_GW}:{PORT}/health;
                    proxy_http_version 1.1;
                }}
                location ^~ /cotizar {{
                    proxy_pass http://{HOST_GW}:{PORT}/cotizar;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }}
                # END COTIZAR PROXY
            """

            # Dedent the block
            lines = COTIZAR_BLOCK.split('\n')
            min_indent = min((len(l) - len(l.lstrip()) for l in lines if l.strip()), default=0)
            COTIZAR_BLOCK = '\n'.join(l[min_indent:] for l in lines)

            with open('/tmp/nginx-original.conf', 'r') as f:
                content = f.read()

            # Remove existing cotizar blocks (marked)
            content = re.sub(r'\s*# BEGIN COTIZAR PROXY.*?# END COTIZAR PROXY\s*', '\n', content, flags=re.DOTALL)

            # Remove any standalone cotizar location blocks (from old deploys)
            lines = content.split('\n')
            clean_lines = []
            skip_depth = 0
            for line in lines:
                stripped = line.strip()
                if skip_depth == 0 and re.match(r'location\s+.*?/cotizar', stripped):
                    skip_depth = line.count('{') - line.count('}')
                    if skip_depth <= 0:
                        skip_depth = 0
                    continue
                if skip_depth > 0:
                    skip_depth += line.count('{') - line.count('}')
                    if skip_depth <= 0:
                        skip_depth = 0
                    continue
                clean_lines.append(line)
            content = '\n'.join(clean_lines)
            content = re.sub(r'\n{3,}', '\n\n', content)

            # Insert before the first "location / {" (root catch-all)
            match = re.search(r'^([ \t]*)(location\s+/\s*\{)', content, re.MULTILINE)
            if match:
                pos = match.start()
                indent = match.group(1)
                # Re-indent the block to match
                block = '\n'.join(indent + l if l.strip() else l for l in COTIZAR_BLOCK.strip().split('\n'))
                content = content[:pos] + block + '\n\n' + content[pos:]
                print(f"Inserted before 'location /' at line {content[:pos].count(chr(10))+1}")
            else:
                # Fallback: find end of first server block
                server_match = re.search(r'server\s*\{', content)
                if server_match:
                    depth = 0
                    for i in range(server_match.start(), len(content)):
                        if content[i] == '{': depth += 1
                        elif content[i] == '}':
                            depth -= 1
                            if depth == 0:
                                content = content[:i] + '\n' + COTIZAR_BLOCK.strip() + '\n' + content[i:]
                                print(f"Inserted at end of server block (pos {i})")
                                break
                else:
                    print("ERROR: No server block found")
                    exit(1)

            with open('/tmp/nginx-modified.conf', 'w') as f:
                f.write(content)
            print("Config modified successfully")
            PYEOF

                  if [ $? -eq 0 ] && [ -f /tmp/nginx-modified.conf ]; then
                    echo ""
                    echo "Modified config (cotizar lines):"
                    grep -n "cotizar\|^~" /tmp/nginx-modified.conf | head -10

                    # Copy modified config into container
                    docker cp /tmp/nginx-modified.conf "$NGINX_CONTAINER":"$CONF_FILE"

                    # Test and reload
                    if docker exec "$NGINX_CONTAINER" nginx -t 2>&1; then
                      docker exec "$NGINX_CONTAINER" nginx -s reload
                      echo "NGINX RELOADED"
                      sleep 3

                      # Verify both health and app
                      if curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null | grep -q '"status"'; then
                        echo "PROXY: /cotizar/health OK"
                        PROXY_CONFIGURED=true
                      fi
                    else
                      echo "NGINX CONFIG INVALID - restoring original"
                      docker cp /tmp/nginx-original.conf "$NGINX_CONTAINER":"$CONF_FILE"
                      docker exec "$NGINX_CONTAINER" nginx -s reload 2>/dev/null || true
                    fi
                  else
                    echo "Config modification failed"
                  fi
                else
                  echo "Could not extract config from $NGINX_CONTAINER:$CONF_FILE"
                fi
              fi

              echo ""
              if $PROXY_CONFIGURED; then
                echo "PROXY STATUS: CONFIGURED"
              else
                echo "========================================"
                echo "WARNING: /cotizar proxy needs attention"
                echo "cotizar works on port $DEPLOY_PORT (direct)"
                echo "Docker nginx may need manual location blocks"
                echo "========================================"
              fi
            fi

            # ==========================================================
            # STEP 8: Final verification
            # ==========================================================
            echo ""
            echo "--- [8/8] Verify ---"

            # Direct service check
            echo -n "Direct health (port $DEPLOY_PORT): "
            curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null && echo "" || echo "FAIL"

            echo -n "Direct API (port $DEPLOY_PORT): "
            curl -sf -o /dev/null -w "HTTP %{http_code}" "http://127.0.0.1:$DEPLOY_PORT/cotizar/api/tenders" 2>/dev/null || echo "FAIL"
            echo ""

            # Proxy check (via Docker nginx on port 80)
            echo -n "Proxy /cotizar/health (port 80): "
            HEALTH_BODY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "FAIL")
            echo "$HEALTH_BODY"
            if echo "$HEALTH_BODY" | grep -q '"status"'; then
              echo "PROXY OK - cotizar accessible via licitometro.ar/cotizar"
            else
              echo "WARN: proxy not returning cotizar health JSON"
              echo "DIAG: Docker nginx config for cotizar:"
              NGINX_C=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -E 'licitometro.*nginx' | head -1)
              [ -n "$NGINX_C" ] && docker exec "$NGINX_C" grep -n "cotizar" /etc/nginx/conf.d/default.conf 2>/dev/null || echo "(not found)"
            fi

            echo -n "Proxy /cotizar (port 80): "
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1/cotizar/" 2>/dev/null || echo "000")
            echo "HTTP $STATUS"

            # Licitometro still alive
            if $LICITO_OK; then
              echo -n "licitometro.ar post-deploy: "
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "STILL ALIVE"
              else
                echo "WARNING - CHECK NOW"
              fi
            fi

            # Cleanup: remove git token from global config
            git config --global --unset-all url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "  DEPLOY COMPLETE"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Smoke test from outside
        if: always()
        run: |
          echo "Checking public URL..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "000")
          echo "https://www.licitometro.ar/cotizar/health -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "PUBLIC HEALTH CHECK: OK"
          else
            echo "Public health check failed (HTTP $STATUS) - may need manual nginx config"
          fi
