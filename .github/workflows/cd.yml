name: CD - Deploy to licitometro.ar

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (default: current)'
        required: false
        type: string
      skip_ci:
        description: 'Skip CI checks (emergency deploy)'
        required: false
        type: boolean
        default: false

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    name: Deploy to licitometro.ar
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT,GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail

            BRANCH="${{ inputs.deploy_branch || github.ref_name }}"

            echo "=========================================="
            echo "  cotizAR CD - branch: $BRANCH"
            echo "  GH_TOKEN length: ${#GH_TOKEN}"
            echo "=========================================="

            # Validate token
            if [ -z "$GH_TOKEN" ] || [ "${#GH_TOKEN}" -lt 10 ]; then
              echo "ERROR: GH_TOKEN is empty or too short!"
              echo "Check that github.token is properly passed via envs parameter"
              exit 1
            fi

            # Configure git auth - clear any stale credentials
            git config --global --unset-all credential.helper 2>/dev/null || true
            git config --global --unset-all "url.https://x-access-token" 2>/dev/null || true
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

            # Build authenticated URL for direct use
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # ==========================================================
            # STEP 0: Pre-flight - licitometro alive?
            # ==========================================================
            echo ""
            echo "--- [0/8] Pre-flight ---"
            LICITO_OK=false
            if curl -sf -o /dev/null -w "" "http://127.0.0.1:80/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP (pre-deploy)"
            elif curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
              LICITO_OK=true; echo "licitometro.ar: UP via HTTPS"
            else
              echo "WARN: cannot reach licitometro (may be normal)"
            fi

            # ==========================================================
            # STEP 1: Ensure Node.js >= 18
            # ==========================================================
            echo ""
            echo "--- [1/8] Node.js ---"
            if command -v node &>/dev/null; then
              NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
              if [ "$NODE_MAJOR" -ge 18 ]; then
                echo "Node $(node -v) OK"
              else
                echo "Node $(node -v) too old, installing 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
                apt-get install -y nodejs
              fi
            else
              echo "Node not found, installing 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # ==========================================================
            # STEP 2: Build tools (for better-sqlite3 native addon)
            # ==========================================================
            echo ""
            echo "--- [2/8] Build tools ---"
            apt-get install -y -qq python3 make g++ 2>/dev/null || true

            # ==========================================================
            # STEP 3: Clone or update code
            # ==========================================================
            echo ""
            echo "--- [3/8] Fetch code ---"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "First deploy - cloning..."
              mkdir -p "$(dirname $DEPLOY_DIR)"
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Ensure remote uses authenticated URL
            git remote set-url origin "$REPO_URL" 2>/dev/null || true

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Previous: $PREV_COMMIT"

            git fetch origin "$BRANCH" || git fetch origin
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH" --ff-only || git reset --hard "origin/$BRANCH"

            echo "Now: $(git log --oneline -1)"

            # ==========================================================
            # STEP 4: Build
            # ==========================================================
            echo ""
            echo "--- [4/8] Build ---"
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            [ -f "$DEPLOY_DIR/dist/api/server.js" ] || { echo "ERROR: build failed"; exit 1; }
            echo "Build OK"

            mkdir -p data bids

            # ==========================================================
            # STEP 5: System user + permissions
            # ==========================================================
            echo ""
            echo "--- [5/8] System user ---"
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
              echo "User 'cotizar' created"
            else
              echo "User 'cotizar' exists"
            fi
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # ==========================================================
            # STEP 5b: Stop old cotizar Docker container
            # ==========================================================
            # Old Docker container occupies port 3001, conflicts with systemd
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -qx "cotizar"; then
              echo "Stopping old cotizar Docker container (frees port $DEPLOY_PORT)..."
              docker stop cotizar 2>/dev/null || true
              sleep 2
            fi

            # ==========================================================
            # STEP 6: Systemd service
            # ==========================================================
            echo ""
            echo "--- [6/8] Systemd service ---"
            NODE_BIN=$(command -v node)

            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$NODE_BIN $DEPLOY_DIR/dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info
            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # fix heredoc indentation
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl restart cotizar
            echo "Service restarted"

            # Health check
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1; then
                HEALTHY=true
                echo "Health OK (attempt $i)"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null || true
                break
              fi
              echo "Waiting... ($i/15)"
              sleep 2
            done

            if ! $HEALTHY; then
              echo "!!! SERVICE FAILED TO START !!!"
              journalctl -u cotizar -n 40 --no-pager 2>/dev/null || true

              if [ "$PREV_COMMIT" != "none" ]; then
                echo "ROLLBACK to $PREV_COMMIT..."
                git checkout "$PREV_COMMIT" 2>/dev/null || true
                npm ci && npm run build && npm prune --omit=dev 2>/dev/null || true
                systemctl restart cotizar
                sleep 5
                curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" >/dev/null 2>&1 && echo "ROLLBACK OK" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            # ==========================================================
            # STEP 7: Inject cotizar proxy into Docker nginx
            # ==========================================================
            echo ""
            echo "--- [7/8] Reverse proxy ---"

            PROXY_CONFIGURED=false

            if curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null | grep -q '"status"'; then
              echo "Proxy already works - skipping"
              PROXY_CONFIGURED=true
            fi

            if ! $PROXY_CONFIGURED; then
              set +e  # Non-fatal: proxy config failure won't kill deploy

              echo "=== Configuring reverse proxy ==="

              # Step A: Find nginx container
              NGINX_CONTAINER=""
              echo "Docker containers:"
              docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Image}}' 2>/dev/null
              for p in 'licitometro.*nginx' 'nginx.*licitometro' 'nginx'; do
                NGINX_CONTAINER=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -iE "$p" | head -1)
                [ -n "$NGINX_CONTAINER" ] && break
              done

              if [ -z "$NGINX_CONTAINER" ]; then
                echo "ERROR: No nginx container found!"
              else
                echo "Nginx container: $NGINX_CONTAINER"

                # Step B: Get host gateway IP
                HOST_GW=$(docker inspect "$NGINX_CONTAINER" -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' 2>/dev/null | cut -c1-15)
                [ -z "$HOST_GW" ] && HOST_GW="172.17.0.1"

                # Test connectivity
                CONN_OK=false
                for TIP in "$HOST_GW" "172.17.0.1" "$(hostname -I 2>/dev/null | awk '{print $1}')"; do
                  [ -z "$TIP" ] && continue
                  HRESULT=$(docker exec "$NGINX_CONTAINER" sh -c "wget -qO- http://${TIP}:${DEPLOY_PORT}/health 2>/dev/null || curl -sf http://${TIP}:${DEPLOY_PORT}/health 2>/dev/null" 2>/dev/null)
                  if echo "$HRESULT" | grep -q "status"; then
                    HOST_GW="$TIP"; CONN_OK=true
                    echo "Connectivity OK: $HOST_GW:$DEPLOY_PORT"
                    break
                  fi
                done
                $CONN_OK || echo "WARN: connectivity unverified, using $HOST_GW"

                # Step C: Dump the FULL nginx config to understand structure
                echo ""
                echo "=== Nginx config dump ==="
                docker exec "$NGINX_CONTAINER" nginx -T 2>&1 > /tmp/nginx-full-dump.txt
                echo "Full dump: $(wc -l < /tmp/nginx-full-dump.txt) lines"

                # Show config files and key directives
                echo "Config files:"
                grep "# configuration file" /tmp/nginx-full-dump.txt 2>/dev/null
                echo "Server blocks:"
                grep -n "server_name\|listen\|location\|proxy_pass\|root\|try_files" /tmp/nginx-full-dump.txt 2>/dev/null | head -30
                echo ""

                # Find the config file that has the server block with location /
                CONF_FILE=""
                CURRENT_FILE=""
                while IFS= read -r line; do
                  case "$line" in
                    *"# configuration file"*)
                      CURRENT_FILE=$(echo "$line" | sed 's/.*file //' | sed 's/://')
                      ;;
                    *"location / {"*|*"location / "*)
                      if [ -n "$CURRENT_FILE" ] && [ "$CURRENT_FILE" != "/etc/nginx/nginx.conf" ]; then
                        CONF_FILE="$CURRENT_FILE"
                        echo "Found 'location /' in: $CONF_FILE"
                        break
                      fi
                      ;;
                  esac
                done < /tmp/nginx-full-dump.txt

                # If no conf.d file has location /, check nginx.conf itself
                if [ -z "$CONF_FILE" ]; then
                  CURRENT_FILE=""
                  while IFS= read -r line; do
                    case "$line" in
                      *"# configuration file"*)
                        CURRENT_FILE=$(echo "$line" | sed 's/.*file //' | sed 's/://')
                        ;;
                      *"location"*)
                        if [ -n "$CURRENT_FILE" ]; then
                          CONF_FILE="$CURRENT_FILE"
                          echo "Found 'location' in: $CONF_FILE"
                          break
                        fi
                        ;;
                    esac
                  done < /tmp/nginx-full-dump.txt
                fi

                [ -z "$CONF_FILE" ] && CONF_FILE="/etc/nginx/conf.d/default.conf"
                echo "Target config: $CONF_FILE"

                # Step D: Read the target config from container
                docker exec "$NGINX_CONTAINER" cat "$CONF_FILE" > /tmp/nginx-target.conf 2>/dev/null
                echo "Read $(wc -l < /tmp/nginx-target.conf 2>/dev/null || echo 0) lines from $CONF_FILE"
                echo "Contents:"
                cat /tmp/nginx-target.conf 2>/dev/null | head -50
                echo "..."

                # Step E: Use Python to inject cotizar proxy blocks
                cat > /tmp/inject_cotizar.py << 'COTIZPYEOF'
            import re, sys, os

            HOST_GW = os.environ.get('HOST_GW_VAL', '172.17.0.1')
            PORT = os.environ.get('DEPLOY_PORT_VAL', '3001')
            UPSTREAM = f'{HOST_GW}:{PORT}'

            COTIZAR_BLOCK = f"""
            # BEGIN COTIZAR PROXY (auto-managed by cotizAR CD)
            location ^~ /cotizar/api/ {{
                proxy_pass http://{UPSTREAM}/cotizar/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 30s;
            }}
            location ^~ /cotizar/config/ {{
                proxy_pass http://{UPSTREAM}/cotizar/config/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }}
            location ^~ /cotizar/health {{
                proxy_pass http://{UPSTREAM}/health;
                proxy_http_version 1.1;
            }}
            location ^~ /cotizar {{
                proxy_pass http://{UPSTREAM}/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }}
            # END COTIZAR PROXY"""

            # Dedent
            lines = COTIZAR_BLOCK.split('\n')
            non_empty = [l for l in lines if l.strip()]
            if non_empty:
                mi = min(len(l) - len(l.lstrip()) for l in non_empty)
                COTIZAR_BLOCK = '\n'.join(
                    l[mi:] if len(l) >= mi else l for l in lines
                )

            with open('/tmp/nginx-target.conf', 'r') as f:
                content = f.read()

            if not content.strip():
                print('ERROR: config is empty')
                sys.exit(1)

            print(f'Input: {len(content)} bytes')

            # Remove old cotizar blocks
            content = re.sub(
                r'\s*# BEGIN COTIZAR PROXY.*?# END COTIZAR PROXY\s*',
                '\n', content, flags=re.DOTALL
            )
            # Remove standalone cotizar locations
            raw = content.split('\n')
            clean = []
            skip = 0
            for line in raw:
                s = line.strip()
                if skip == 0 and re.match(r'location\s+.*?/cotizar', s):
                    skip = line.count('{') - line.count('}')
                    if skip <= 0: skip = 0
                    continue
                if skip > 0:
                    skip += line.count('{') - line.count('}')
                    if skip <= 0: skip = 0
                    continue
                clean.append(line)
            content = '\n'.join(clean)
            content = re.sub(r'\n{3,}', '\n\n', content)
            # Remove old includes
            content = re.sub(
                r'[^\n]*cotizar-proxy\.inc[^\n]*\n?', '', content
            )

            # Find insertion point
            m = re.search(r'^([ \t]*)(location\s+/\s*\{)', content, re.MULTILINE)
            if m:
                pos = m.start()
                indent = m.group(1)
                block = '\n'.join(
                    indent + l.strip() if l.strip() else ''
                    for l in COTIZAR_BLOCK.strip().split('\n')
                )
                content = content[:pos] + block + '\n\n' + content[pos:]
                print(f'Inserted before "location /" at char {pos}')
            else:
                # Before closing brace of first server block
                srv = re.search(r'server\s*\{', content)
                if srv:
                    depth = 0
                    for i in range(srv.start(), len(content)):
                        if content[i] == '{': depth += 1
                        elif content[i] == '}':
                            depth -= 1
                            if depth == 0:
                                b = '\n' + COTIZAR_BLOCK.strip() + '\n'
                                content = content[:i] + b + content[i:]
                                print(f'Inserted at server block end pos {i}')
                                break
                else:
                    print('ERROR: no server block found')
                    print('Content preview:')
                    print(content[:500])
                    sys.exit(1)

            with open('/tmp/nginx-modified.conf', 'w') as f:
                f.write(content)

            print(f'Output: {len(content)} bytes')
            for i, line in enumerate(content.split('\n'), 1):
                if 'cotizar' in line.lower() or '^~' in line:
                    print(f'  L{i}: {line.rstrip()}')
            print('INJECT OK')
            COTIZPYEOF
                echo "Running config injection..."
                HOST_GW_VAL="$HOST_GW" DEPLOY_PORT_VAL="$DEPLOY_PORT" python3 /tmp/inject_cotizar.py
                PYEXIT=$?
                echo "Python exit: $PYEXIT"

                if [ "$PYEXIT" -eq 0 ] && [ -f /tmp/nginx-modified.conf ] && [ -s /tmp/nginx-modified.conf ]; then
                  echo "Modified config preview:"
                  grep -n "cotizar\|location\|include" /tmp/nginx-modified.conf 2>/dev/null | head -20

                  # Step F: Write modified config back via base64+docker exec
                  # This avoids stdin piping issues AND works with bind mounts
                  B64=$(base64 -w0 /tmp/nginx-modified.conf)
                  echo "Base64 size: ${#B64} chars"
                  docker exec "$NGINX_CONTAINER" sh -c "echo '$B64' | base64 -d > $CONF_FILE"
                  echo "Wrote config via base64+docker exec"

                  # Verify write
                  WRITTEN=$(docker exec "$NGINX_CONTAINER" grep -c "cotizar" "$CONF_FILE" 2>/dev/null || echo "0")
                  echo "Verify: $WRITTEN lines with 'cotizar' in container config"

                  if [ "$WRITTEN" -gt 0 ]; then
                    # Test nginx config
                    echo ""
                    echo "Testing nginx config..."
                    NGINX_TEST=$(docker exec "$NGINX_CONTAINER" nginx -t 2>&1)
                    echo "$NGINX_TEST"

                    if echo "$NGINX_TEST" | grep -q "successful"; then
                      docker exec "$NGINX_CONTAINER" nginx -s reload
                      echo "NGINX RELOADED"
                      sleep 3

                      # Verify proxy
                      VERIFY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "")
                      if echo "$VERIFY" | grep -q '"status"'; then
                        echo "PROXY VERIFIED OK"
                        PROXY_CONFIGURED=true
                      else
                        echo "PROXY NOT WORKING after reload"
                        echo "  curl response: $(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1/cotizar/health 2>/dev/null)"
                        echo "  Content-Type: $(curl -sf -D- http://127.0.0.1/cotizar/health 2>/dev/null | grep -i content-type | head -1)"
                        echo "  Active nginx config (cotizar related):"
                        docker exec "$NGINX_CONTAINER" nginx -T 2>&1 | grep -B2 -A5 "cotizar" | head -40
                      fi
                    else
                      echo "NGINX CONFIG INVALID - restoring"
                      docker exec "$NGINX_CONTAINER" cat "${CONF_FILE}.bak" > /dev/null 2>&1 && \
                        docker exec "$NGINX_CONTAINER" cp "${CONF_FILE}.bak" "$CONF_FILE" 2>/dev/null
                      docker exec "$NGINX_CONTAINER" nginx -s reload 2>/dev/null
                    fi
                  else
                    echo "ERROR: base64 write failed - cotizar not in config"
                    echo "Checking if file is writable..."
                    docker exec "$NGINX_CONTAINER" ls -la "$CONF_FILE" 2>/dev/null
                    docker exec "$NGINX_CONTAINER" mount 2>/dev/null | grep nginx | head -5
                  fi
                else
                  echo "Python injection failed"
                fi
              fi

              set -euo pipefail

              echo ""
              if $PROXY_CONFIGURED; then
                echo "PROXY STATUS: CONFIGURED"
              else
                echo "========================================"
                echo "WARNING: Proxy auto-config incomplete"
                echo "cotizar direct: http://localhost:$DEPLOY_PORT"
                echo "========================================"
              fi
            fi

            # ==========================================================
            # STEP 8: Final verification
            # ==========================================================
            echo ""
            echo "--- [8/8] Verify ---"

            # Direct service check
            echo -n "Direct health (port $DEPLOY_PORT): "
            curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" 2>/dev/null && echo "" || echo "FAIL"

            echo -n "Direct API (port $DEPLOY_PORT): "
            curl -sf -o /dev/null -w "HTTP %{http_code}" "http://127.0.0.1:$DEPLOY_PORT/cotizar/api/tenders" 2>/dev/null || echo "FAIL"
            echo ""

            # Proxy check (via Docker nginx on port 80)
            echo -n "Proxy /cotizar/health (port 80): "
            HEALTH_BODY=$(curl -sf "http://127.0.0.1/cotizar/health" 2>/dev/null || echo "FAIL")
            echo "$HEALTH_BODY"
            if echo "$HEALTH_BODY" | grep -q '"status"'; then
              echo "PROXY OK - cotizar accessible via licitometro.ar/cotizar"
            else
              echo "WARN: proxy not returning cotizar health JSON"
              echo "DIAG: Docker nginx config for cotizar:"
              NGINX_C=$(docker ps --format '{{.Names}}' 2>/dev/null | grep -E 'licitometro.*nginx' | head -1)
              [ -n "$NGINX_C" ] && docker exec "$NGINX_C" grep -n "cotizar" /etc/nginx/conf.d/default.conf 2>/dev/null || echo "(not found)"
            fi

            echo -n "Proxy /cotizar (port 80): "
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1/cotizar/" 2>/dev/null || echo "000")
            echo "HTTP $STATUS"

            # Licitometro still alive
            if $LICITO_OK; then
              echo -n "licitometro.ar post-deploy: "
              if curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null || curl -sfk -o /dev/null "https://127.0.0.1/" 2>/dev/null; then
                echo "STILL ALIVE"
              else
                echo "WARNING - CHECK NOW"
              fi
            fi

            # Cleanup: remove git token from global config
            git config --global --unset-all url.https://x-access-token:${GH_TOKEN}@github.com/.insteadof 2>/dev/null || true

            echo ""
            echo "=========================================="
            echo "  DEPLOY COMPLETE"
            echo "  Branch: $BRANCH"
            echo "  Commit: $(git log --oneline -1)"
            echo "  URL: https://www.licitometro.ar/cotizar"
            echo "=========================================="

      - name: Smoke test from outside
        if: always()
        run: |
          echo "Checking public URL..."
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://www.licitometro.ar/cotizar/health" 2>/dev/null || echo "000")
          echo "https://www.licitometro.ar/cotizar/health -> HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "PUBLIC HEALTH CHECK: OK"
          else
            echo "Public health check failed (HTTP $STATUS) - may need manual nginx config"
          fi
