name: Setup - First deploy to licitometro.ar

# Manual only - run this ONCE to set up cotizar on the server
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "setup" to confirm first-time setup'
        required: true
        type: string

env:
  DEPLOY_DIR: /opt/cotizar
  DEPLOY_PORT: 3001

jobs:
  setup:
    name: First-time setup on licitometro.ar
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'setup' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup cotizar service (safe - does NOT touch licitometro)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_PORT
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "=========================================="
            echo "  cotizAR - FIRST TIME SETUP"
            echo "  SAFE: Does NOT modify licitometro.ar"
            echo "=========================================="

            # Verify licitometro is running BEFORE we do anything
            echo ""
            echo "--- Checking licitometro.ar is alive ---"
            curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null && echo "licitometro.ar: OK" || echo "WARNING: could not reach licitometro on port 80"

            # Install Node.js 20 if not present
            if ! command -v node &> /dev/null || [ "$(node -v | sed 's/v//' | cut -d. -f1)" -lt 18 ]; then
              echo "Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node -v) / npm: $(npm -v)"

            # Install build tools
            apt-get install -y python3 make g++ 2>/dev/null || true

            # Clone repo
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Cloning repo..."
              mkdir -p "$DEPLOY_DIR"
              git clone -b main "https://github.com/${{ github.repository }}.git" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            git fetch origin main
            git checkout main
            git pull origin main

            # Build
            npm ci
            npm run build
            npm prune --omit=dev 2>/dev/null || true

            if [ ! -f "dist/api/server.js" ]; then
              echo "ERROR: Build failed"
              exit 1
            fi

            # Create system user
            if ! id cotizar &>/dev/null; then
              useradd --system --home-dir "$DEPLOY_DIR" --shell /usr/sbin/nologin cotizar
            fi

            mkdir -p "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"
            chown -R cotizar:cotizar "$DEPLOY_DIR/data" "$DEPLOY_DIR/bids"

            # Create systemd service
            cat > /etc/systemd/system/cotizar.service << SVCEOF
            [Unit]
            Description=cotizAR - Armador de Cotizaciones para Licitaciones
            After=network.target

            [Service]
            Type=simple
            User=cotizar
            Group=cotizar
            WorkingDirectory=$DEPLOY_DIR
            ExecStart=$(command -v node) dist/api/server.js
            Restart=on-failure
            RestartSec=5
            Environment=NODE_ENV=production
            Environment=PORT=$DEPLOY_PORT
            Environment=BASE_PATH=/cotizar
            Environment=API_HOST=127.0.0.1
            Environment=DB_PATH=$DEPLOY_DIR/data/cotizar.db
            Environment=LOG_LEVEL=info

            NoNewPrivileges=true
            ProtectSystem=strict
            ProtectHome=true
            ReadWritePaths=$DEPLOY_DIR/bids $DEPLOY_DIR/data
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SVCEOF

            # Remove leading spaces from heredoc
            sed -i 's/^            //' /etc/systemd/system/cotizar.service

            systemctl daemon-reload
            systemctl enable cotizar
            systemctl start cotizar

            # Health check
            echo "Waiting for cotizar to start..."
            for i in $(seq 1 10); do
              if curl -sf "http://127.0.0.1:$DEPLOY_PORT/health" > /dev/null 2>&1; then
                echo "cotizar: RUNNING on port $DEPLOY_PORT"
                curl -s "http://127.0.0.1:$DEPLOY_PORT/health" | python3 -m json.tool 2>/dev/null || true
                break
              fi
              sleep 2
            done

            # Create nginx snippet (does NOT modify existing nginx config)
            mkdir -p /etc/nginx/snippets
            cat > /etc/nginx/snippets/cotizar.conf << 'NGXEOF'
            # cotizAR - proxy snippet
            # Add to your licitometro server block: include /etc/nginx/snippets/cotizar.conf;

            location /cotizar/api/ {
                proxy_pass http://127.0.0.1:3001/cotizar/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 30s;
            }

            location /cotizar/config/ {
                proxy_pass http://127.0.0.1:3001/cotizar/config/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location /cotizar {
                proxy_pass http://127.0.0.1:3001/cotizar;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            NGXEOF

            # Remove leading spaces
            sed -i 's/^            //' /etc/nginx/snippets/cotizar.conf

            echo ""
            echo "=========================================="
            echo "  SETUP COMPLETE"
            echo "=========================================="
            echo ""
            echo "cotizar service: running on port $DEPLOY_PORT"
            echo "nginx snippet created: /etc/nginx/snippets/cotizar.conf"
            echo ""
            echo "MANUAL STEP NEEDED:"
            echo "  Add this line inside your licitometro nginx server block:"
            echo "      include /etc/nginx/snippets/cotizar.conf;"
            echo "  Then: nginx -t && nginx -s reload"
            echo ""

            # Verify licitometro is STILL running
            echo "--- Post-setup check ---"
            curl -sf -o /dev/null "http://127.0.0.1:80/" 2>/dev/null && echo "licitometro.ar: STILL RUNNING - SAFE" || echo "WARNING: check licitometro"
