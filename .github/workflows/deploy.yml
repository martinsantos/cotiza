# Deploy deshabilitado — no usamos GitHub Actions.
# El deploy se hace via cron + watch.sh en el VPS:
#   cron (cada 1 min) → scripts/watch.sh → scripts/deploy.sh
#
# Para instalar: bash /opt/cotizar/scripts/install-watch.sh
# Para deploy manual: bash /opt/cotizar/scripts/deploy.sh
#
# Ver log: tail -f /var/log/cotizar-watch.log

name: Deploy cotizAR → VPS (disabled)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy → VPS
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy via cron/watch.sh — no Actions"
