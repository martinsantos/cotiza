services:
  cotizar-api:
    image: ghcr.io/martinsantos/cotiza:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotizar-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    # Variables sensibles (LICITOMETRO_API_KEY, etc.) se leen del archivo .env en el mismo directorio
    env_file:
      - path: .env
        required: false   # No falla si .env no existe (útil en CI sin secrets)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_HOST=0.0.0.0
      - BASE_PATH=/cotizar
      # URL de la API de LICITOMETRO.AR
      # En el mismo servidor (Docker interno): LICITOMETRO_API_URL=http://<servicio-licitometro>:<puerto>/api
      # En staging/dev o sin red interna: usar la URL pública (fallback)
      - LICITOMETRO_API_URL=${LICITOMETRO_API_URL:-https://www.licitometro.ar/api}
      # API Key para autenticar en endpoints de usuario de LICITOMETRO.AR (favoritos, etc.)
      # El usuario marca favoritas en https://licitometro.ar/licitaciones
      # cotizAR los lee via: GET <LICITOMETRO_API_URL>/favoritos con este Bearer token
      - LICITOMETRO_API_KEY=${LICITOMETRO_API_KEY:-}
    volumes:
      - cotizar-bids:/app/bids
    networks:
      - cotizar-network
      - licitometro_internal   # Red compartida con LICITOMETRO.AR para comunicación interna directa
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/cotizar/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Nginx reverse proxy — included in the main licitometro.ar nginx when available,
  # or use this standalone for independent deployment
  nginx:
    image: nginx:alpine
    container_name: cotizar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cotizar-api
    networks:
      - cotizar-network
    profiles:
      - production

volumes:
  cotizar-bids:

networks:
  cotizar-network:
    name: cotizar-network
  licitometro_internal:
    external: true   # Creada por el docker-compose de LICITOMETRO.AR — ambos servicios la comparten
