services:
  cotizar-api:
    image: ghcr.io/martinsantos/cotiza:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotizar-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_HOST=0.0.0.0
      - BASE_PATH=/cotizar
      - LICITOMETRO_API_URL=https://www.licitometro.ar/api
    volumes:
      - cotizar-bids:/app/bids
    networks:
      - cotizar-network
      - licitometro_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/cotizar/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx reverse proxy — included in the main licitometro.ar nginx when available,
  # or use this standalone for independent deployment
  nginx:
    image: nginx:alpine
    container_name: cotizar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cotizar-api
    networks:
      - cotizar-network
    profiles:
      - production

volumes:
  cotizar-bids:

networks:
  cotizar-network:
    name: cotizar-network
  licitometro_internal:
    external: true
