version: '3.8'

services:
  cotizar-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotizar-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_HOST=0.0.0.0
    volumes:
      - ./cotizar.config.json:/app/cotizar.config.json:ro
      - ./bids:/app/bids
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: cotizar-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cotizar-api

networks:
  default:
    name: cotizar-network
