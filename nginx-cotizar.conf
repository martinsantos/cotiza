# Include this snippet in the main licitometro.ar nginx server block
# to integrate the cotizAR module at /cotizar
#
# Usage in the main licitometro.ar nginx config:
#   server {
#       listen 80;
#       server_name www.licitometro.ar licitometro.ar;
#       ...
#       include /etc/nginx/snippets/cotizar.conf;
#   }

# Rate limiting for cotizar API
limit_req_zone $binary_remote_addr zone=cotizar_api:10m rate=10r/s;

location /cotizar {
    limit_req zone=cotizar_api burst=20 nodelay;

    proxy_pass http://cotizar-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Timeouts for long-running operations (sync, PDF generation)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
