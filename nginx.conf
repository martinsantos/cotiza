events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name www.licitometro.ar licitometro.ar localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ============================================
        # cotizAR app mounted at /cotizar
        # ============================================

        # API routes under /cotizar/api/
        location /cotizar/api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://cotizar-api:3000/cotizar/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # cotizAR config/base-path endpoint
        location /cotizar/config/ {
            proxy_pass http://cotizar-api:3000/cotizar/config/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # cotizAR health check
        location /cotizar/health {
            proxy_pass http://cotizar-api:3000/health;
        }

        # Health check at root (for load balancer)
        location = /health {
            proxy_pass http://cotizar-api:3000/health;
        }

        # cotizAR static files and SPA
        location /cotizar {
            proxy_pass http://cotizar-api:3000/cotizar;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================
        # Main licitometro.ar site (placeholder)
        # Replace with actual licitometro.ar config
        # ============================================
        location / {
            # If licitometro.ar has its own backend, proxy to it here:
            # proxy_pass http://licitometro-backend:8080;

            # For now, return a redirect to /cotizar
            return 302 /cotizar;
        }
    }

    # HTTPS server (configure for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name www.licitometro.ar licitometro.ar;
    #
    #     ssl_certificate /etc/ssl/certs/licitometro.ar.crt;
    #     ssl_certificate_key /etc/ssl/private/licitometro.ar.key;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Same location blocks as above
    # }
}
